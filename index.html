    const cfg = await DB.get('configuracion', 'config') || {};

    U.id('view-area').innerHTML = `
      <div class="page-header"><div><h1>Seguridad</h1><p>Control de acceso y configuración de seguridad</p></div></div>
      <div class="page-content">
        <div class="stats-grid stats-grid-3" style="margin-bottom:14px">
          <div class="stat-card green"><div class="stat-label">Total Usuarios</div><div class="stat-value">${users.length}</div></div>
          <div class="stat-card red"><div class="stat-label">Cuentas Bloqueadas</div><div class="stat-value">${bloqueados.length}</div></div>
          <div class="stat-card blue"><div class="stat-label">Usuarios Activos</div><div class="stat-value">${users.filter(u=>u.activo).length}</div></div>
        </div>

        <div class="config-section">
          <div class="config-section-header"><h3>🔐 Configuración de Contraseñas</h3></div>
          <div class="config-section-body">
            <div class="toggle-row"><div class="toggle-label"><h4>Forzar cambio de contraseña</h4><p>Requerir cambio cada 90 días</p></div><label class="toggle-switch"><input type="checkbox" id="sec-forzar90" ${cfg.forzarCambio90?'checked':''} onchange="Views.Seguridad.saveConfig()"><span class="toggle-slider"></span></label></div>
            <div class="toggle-row"><div class="toggle-label"><h4>Contraseña compleja</h4><p>Mayúsculas, números y símbolos</p></div><label class="toggle-switch"><input type="checkbox" id="sec-compleja" ${cfg.passComplexa!==false?'checked':''} onchange="Views.Seguridad.saveConfig()"><span class="toggle-slider"></span></label></div>
            <div class="toggle-row"><div class="toggle-label"><h4>Bloqueo automático</h4><p>Bloquear después de 5 intentos fallidos</p></div><label class="toggle-switch"><input type="checkbox" id="sec-bloqueo" ${cfg.bloqueoAuto!==false?'checked':''} onchange="Views.Seguridad.saveConfig()"><span class="toggle-slider"></span></label></div>
          </div>
        </div>

        ${bloqueados.length ? `
        <div class="config-section">
          <div class="config-section-header"><h3>🔓 Cuentas Bloqueadas</h3></div>
          <div class="config-section-body">
            ${bloqueados.map(u=>`<div class="flex justify-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
              <span class="text-sm fw-700">@${U.esc(u.username)} — ${U.esc(u.nombre)}</span>
              <button class="btn btn-green btn-sm" onclick="Views.Seguridad.desbloquear('${u.id}')">🔓 Desbloquear</button>
            </div>`).join('')}
          </div>
        </div>` : ''}

        <div class="card" style="padding:0;overflow:hidden">
          <div class="card-sm" style="border-bottom:1px solid var(--border);font-weight:700">Últimos accesos al sistema</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Usuario</th><th>Evento</th><th>Fecha</th><th>IP</th></tr></thead>
            <tbody>${accesos.map(a=>`<tr>
              <td style="font-weight:600">@${U.esc(a.usuario)}</td>
              <td>${({login:'<span class="badge badge-green">Login</span>',logout:'<span class="badge badge-blue">Logout</span>',acceso_denegado:'<span class="badge badge-yellow">🔒 Denegado</span>'}[a.tipo])||'<span class="badge badge-red">Fallido</span>'}</td>
              <td>${U.fmt.datetime(a.fecha)}</td>
              <td>${U.esc(a.ip||'—')}</td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>
      </div>`;
  },

  async saveConfig() {
    const cfg = await DB.get('configuracion', 'config') || { id: 'config' };
    cfg.forzarCambio90 = U.id('sec-forzar90')?.checked || false;
    cfg.passComplexa = U.id('sec-compleja')?.checked !== false;
    cfg.bloqueoAuto = U.id('sec-bloqueo')?.checked !== false;
    await DB.put('configuracion', cfg);
    Toast.success('Configuración de seguridad guardada');
  },

  async desbloquear(id) {
    const u = await DB.get('usuarios', id);
    u.bloqueado = false; u.activo = true; u.intentosFallidos = 0;
    await DB.put('usuarios', u);
    Toast.success(`@${u.username} desbloqueado`);
    await Views.Seguridad.render();
  }
};

/* ─── NOTIFICACIONES ─── */
Views.Notificaciones = {
  _filtro: 'todas',

  async render() {
    document.getElementById('topbar-title').textContent = 'Notificaciones';
    U.id('topbar-actions').innerHTML = `
      <button class="btn btn-secondary btn-sm" onclick="Views.Notificaciones.limpiarLeidas()">🗑️ Limpiar leídas</button>
      <button class="btn btn-primary btn-sm" onclick="Views.Notificaciones.marcarTodas()">✓ Marcar todas leídas</button>`;
    await Views.Notificaciones.renderList(Views.Notificaciones._filtro);
  },

  async renderList(filtro = 'todas') {
    Views.Notificaciones._filtro = filtro;
    const all = (await DB.getAll('notificaciones')).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
    const noLeidas = all.filter(n=>!n.leida).length;
    const notifs = filtro === 'todas' ? all
      : filtro === 'noLeidas' ? all.filter(n=>!n.leida)
      : all.filter(n=>n.tipo===filtro);

    const tipoIcon  = { stock_bajo:'⚠️', stock_agotado:'🔴', stock_sobrante:'📦', venta:'💰', sistema:'ℹ️', cobro_credito:'💳' };
    const tipoColor = { stock_bajo:'var(--yellow)', stock_agotado:'var(--red)', stock_sobrante:'var(--blue)', venta:'var(--green)', sistema:'var(--blue)', cobro_credito:'var(--purple)' };

    U.id('view-area').innerHTML = `
      <div class="filter-bar">
        <button class="btn btn-${filtro==='todas'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('todas')">Todas (${all.length})</button>
        <button class="btn btn-${filtro==='noLeidas'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('noLeidas')">Sin leer ${noLeidas>0?`<span class="badge badge-red" style="margin-left:4px">${noLeidas}</span>`:''}</button>
        <button class="btn btn-${filtro==='stock_agotado'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('stock_agotado')">🔴 Agotados</button>
        <button class="btn btn-${filtro==='stock_bajo'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('stock_bajo')">⚠️ Stock bajo</button>
        <button class="btn btn-${filtro==='stock_sobrante'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('stock_sobrante')">📦 Sobre stock</button>
        <button class="btn btn-${filtro==='venta'?'primary':'ghost'} btn-sm" onclick="Views.Notificaciones.renderList('venta')">💰 Ventas</button>
      </div>
      <div class="page-content">
        ${notifs.length ? notifs.map(n=>`
          <div class="card card-sm" style="margin-bottom:8px;${!n.leida?`border-left:3px solid ${tipoColor[n.tipo]||'var(--accent)'}`:''};${n.leida?'opacity:.55':''}">
            <div class="flex justify-between" style="gap:12px">
              <div class="flex gap-8" style="flex:1;min-width:0">
                <span style="font-size:18px;flex-shrink:0">${tipoIcon[n.tipo]||'🔔'}</span>
                <div style="min-width:0">
                  <div style="font-weight:600;font-size:.82rem">${U.esc(n.titulo)}</div>
                  <div style="font-size:.75rem;color:var(--text3);margin-top:2px;word-break:break-word">${U.esc(n.mensaje)}</div>
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
                <div style="font-size:.65rem;color:var(--text3);white-space:nowrap">${U.fmt.datetime(n.fecha)}</div>
                <div style="display:flex;gap:4px">
                  ${!n.leida?`<button class="btn btn-ghost btn-sm" style="font-size:.65rem;padding:2px 6px" onclick="Views.Notificaciones.marcar('${n.id}')">✓ Leída</button>`:''}
                  <button class="btn btn-ghost btn-sm" style="font-size:.65rem;padding:2px 6px;color:var(--red)" onclick="Views.Notificaciones.eliminar('${n.id}')">✕</button>
                </div>
              </div>
            </div>
          </div>`).join('')
          : `<div class="empty-state"><div class="empty-state-icon">🔔</div><h3>${filtro==='noLeidas'?'Sin notificaciones pendientes':'Sin notificaciones'}</h3><p>Todo está en orden</p></div>`}
      </div>`;
  },

  async marcar(id) {
    const n = await DB.get('notificaciones', id);
    if (n) { n.leida = true; await DB.put('notificaciones', n); }
    await Views.Notificaciones.renderList(Views.Notificaciones._filtro);
  },

  async eliminar(id) {
    await DB.delete('notificaciones', id);
    await Views.Notificaciones.renderList(Views.Notificaciones._filtro);
  },

  async marcarTodas() {
    const notifs = await DB.getAll('notificaciones');
    for (const n of notifs) { n.leida = true; await DB.put('notificaciones', n); }
    Toast.success('Todas marcadas como leídas');
    await Views.Notificaciones.renderList(Views.Notificaciones._filtro);
  },

  async limpiarLeidas() {
    const notifs = await DB.getAll('notificaciones');
    const leidas = notifs.filter(n=>n.leida);
    for (const n of leidas) await DB.delete('notificaciones', n.id);
    Toast.success(`${leidas.length} notificaciones eliminadas`);
    await Views.Notificaciones.renderList('todas');
  }
};

              <td style="color:var(--text3);font-size:.72rem">${U.fmt.datetime(a.fecha)}</td>
              <td style="color:var(--text3)">${U.esc(a.ip||'127.0.0.1')}</td>
            </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text3)">Sin registros de acceso</td></tr>'}</tbody>
          </table></div>
        </div>
      </div>`;
  },

  async exportCSV() {
    const accesos = (await DB.getAll('accesos')).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    const headers = ['Usuario','Evento','Detalle','Fecha','IP'];
    const rows = accesos.map(a=>[a.usuario,a.tipo,a.detalle||'',a.fecha,a.ip||'127.0.0.1']);
    U.exportExcel('registro-accesos.xlsx', headers, rows);
    Toast.success('Excel exportado');
  },

  limpiar() {
    App.confirm('¿Eliminar todos los registros de acceso? Esta acción no se puede deshacer.', async () => {
      await DB.clear('accesos');
      Toast.success('Registros limpiados');
      await Views.Accesos.render();
    });
  }
};

          <div class="config-section-body">
            <div style="font-size:.75rem;color:var(--text3);margin-bottom:10px">
              Las anulaciones son lógicas: conservan el historial y revierten los efectos correspondientes cuando aplique.
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:.78rem;margin:8px 0">
              <input type="checkbox" id="cfg-anulaciones-motivo" ${cfg.anulacionesRequierenMotivo !== false ? 'checked' : ''}/>

            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:.78rem;margin:8px 0">
              <input type="checkbox" id="cfg-anulaciones-confirmacion" ${cfg.anulacionesRequierenConfirmacion !== false ? 'checked' : ''}/>

          </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
          <button class="btn btn-secondary" onclick="Views.Configuracion.resetDB()">⚠️ Resetear Datos Demo</button>
          <button class="btn btn-primary" onclick="Views.Configuracion.save()">💾 Guardar Configuración</button>
        </div>
      </div>`;
  },

  async save() {
    const existing = await DB.get('configuracion', 'config') || {};
    const value = (id, fallback = '') => U.id(id)?.value?.trim?.() ?? fallback;
    const numberValue = (id, fallback = 0) => {
      const raw = U.id(id)?.value;
      const n = Number(raw);
      return Number.isFinite(n) ? n : fallback;
    };
    const cfg = {
      ...existing,
      id: 'config',
      // Los datos legales/comerciales de J&M AROMAS permanecen internos en BD.
      moneda: value('cfg-moneda', existing.moneda || 'DOP'),
      simbolo: value('cfg-simbolo', existing.simbolo || 'RD$'),
      facturaPrefix: value('cfg-fac', existing.facturaPrefix || 'FAC'),
      metaVentasMes: numberValue('cfg-meta-ventas', Number(existing.metaVentasMes || 0)),
      puntosPorRD: numberValue('cfg-puntos-tasa', Number(existing.puntosPorRD || 100)),
      puntosParaCanje: numberValue('cfg-puntos-canje', Number(existing.puntosParaCanje || 500)),
      backupAuto: U.id('cfg-backup-auto')?.checked ?? Boolean(existing.backupAuto),
      ocPrefix: value('cfg-oc', existing.ocPrefix || 'OC'),
      anulacionesRequierenMotivo: U.id('cfg-anulaciones-motivo')?.checked ?? Boolean(existing.anulacionesRequierenMotivo ?? true),
      anulacionesRequierenConfirmacion: U.id('cfg-anulaciones-confirmacion')?.checked ?? Boolean(existing.anulacionesRequierenConfirmacion ?? true)
    };
    Views.Configuracion._pendingLogo = undefined;
    await DB.put('configuracion', cfg);
    Toast.success('Configuración guardada');
  },
  _pendingLogo: undefined,

  previewLogo(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 250000) { Toast.error('Imagen demasiado grande (máx. 200KB)'); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = e => {
      Views.Configuracion._pendingLogo = e.target.result;
      const prev = U.id('logo-preview');
      if (prev) { prev.src = e.target.result; prev.tagName === 'DIV' && (prev.outerHTML = `<img src="${e.target.result}" style="height:48px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);padding:4px;object-fit:contain" id="logo-preview"/>`); }
      Toast.info('Logo listo — guarda la configuración para aplicarlo');
    };
    reader.readAsDataURL(file);
  },

  removeLogo() {
    Views.Configuracion._pendingLogo = '';
    const prev = U.id('logo-preview');
    if (prev) prev.src = '';
    Toast.info('Logo eliminado — guarda para confirmar');
  },

  async resetDB() {
    App.confirm('⚠️ Esto borrará TODOS los datos y restaurará los datos de demostración. Esta acción es irreversible.', async () => {
      for (const store of DB.STORES) await DB.clear(store);
      Toast.info('Base de datos limpiada. Recargando...');
      await U.sleep(1000);
      location.reload();
    });
  }
};

  async backupDB(silencioso = false) {
    if (Auth.currentUser?.rol !== 'administrador') { Toast.error('Solo el administrador puede generar backups'); return; }
    if (!silencioso) Toast.info('Generando backup...');
    const backup = {
      version: '2.1',
      fecha: new Date().toISOString(),
      app: 'J&M AROMAS',
      stores: {}
    };
    for (const store of DB.STORES) {
      try { backup.stores[store] = await DB.getAll(store); } catch(e) { backup.stores[store] = []; }
    }
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jm-aromas-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    Toast.success(`Respaldo JSON generado · ${(json.length/1024).toFixed(1)}KB · ${DB.STORES.length} tablas`);
  },

  importBackup() {
    App.openModal('Restaurar Backup', `
      <div class="alert" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;margin-bottom:12px">
        <span>⚠️</span>
        <div style="font-size:.78rem;color:var(--red)"><strong>Advertencia:</strong> Restaurar un backup reemplazará TODOS los datos actuales. Esta acción no se puede deshacer.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Archivo de backup (.json)</label>
        <input type="file" class="form-control" id="backup-file" accept=".json" style="cursor:pointer"/>
      </div>
      <div id="backup-preview" style="margin-top:10px"></div>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button>
       <button class="btn btn-danger" onclick="Views.Sistema.processRestore()">⚠️ Restaurar y Reemplazar</button>`
    );
    setTimeout(() => {
      U.id('backup-file')?.addEventListener('change', e => Views.Sistema.previewBackup(e.target.files[0]));
    }, 50);
  },

  previewBackup(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        const prev = U.id('backup-preview');
        if (!prev) return;
        if (!data.stores || !data.app) { prev.innerHTML = `<div style="color:var(--red);font-size:.78rem">❌ Archivo inválido — no es un backup de J&M AROMAS</div>`; return; }
        const counts = Object.entries(data.stores).map(([k,v])=>`${k}: ${v.length}`).join(' · ');
        prev.innerHTML = `
          <div class="card card-sm" style="background:var(--bg3)">
            <div style="font-size:.75rem;font-weight:700;margin-bottom:6px">✅ Backup válido</div>
            <div style="font-size:.7rem;color:var(--text3)">Versión: ${data.version||'—'} · Fecha: ${data.fecha?new Date(data.fecha).toLocaleString('es-DO'):'—'}</div>
            <div style="font-size:.68rem;color:var(--text3);margin-top:4px;line-height:1.6">${counts}</div>
          </div>`;
        Views.Sistema._pendingRestore = data;
      } catch {
        U.id('backup-preview').innerHTML = `<div style="color:var(--red);font-size:.78rem">❌ JSON inválido o archivo corrupto</div>`;
        Views.Sistema._pendingRestore = null;
      }
    };
    reader.readAsText(file);
  },

  _pendingRestore: null,

  async processRestore() {
    if (Auth.currentUser?.rol !== 'administrador') { Toast.error('Solo el administrador puede restaurar backups'); return; }
    const data = Views.Sistema._pendingRestore;
    if (!data) { Toast.error('Selecciona un archivo de backup válido'); return; }
    App.closeModal();
    Toast.info('Restaurando datos...');
    try {
      for (const store of DB.STORES) {
        await DB.clear(store);
        const records = data.stores[store] || [];
        for (const rec of records) await DB.put(store, rec);
      }
      Toast.success(`Backup restaurado · ${Object.values(data.stores).reduce((s,v)=>s+v.length,0)} registros`);
      await U.sleep(1000);
      location.reload();
    } catch(err) {
      Toast.error(`Error al restaurar: ${err.message}`);
    }
  }
};

    const totalCreditoOtorgado = clientes.reduce((s, c) => s + (c.credito || 0), 0);
    const cobrosTotal = movimientos.filter(m => m.tipo === 'cobro_credito').reduce((s, m) => s + (m.monto || 0), 0);

  /* ── Render aging chart ── */
  renderAgingChart(aging) {
    const canvas = document.getElementById('cc-aging-chart');
    if (!canvas) return;
    // Destroy existing
    App.charts.forEach(c => { try { c.destroy(); } catch(e){} });
    App.charts = [];
    const total = Object.values(aging).reduce((s,v) => s+v, 0);
    if (total === 0) { canvas.parentElement.innerHTML += '<div style="text-align:center;color:var(--text3);padding:16px">Sin datos de aging disponibles</div>'; return; }

      type: 'bar',
      data: {
        labels: ['Corriente', '1–30 días', '31–60 días', '61–90 días', '+90 días'],
        datasets: [{
          data: [aging.corriente, aging.dias30, aging.dias60, aging.dias90, aging.masde90],

          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: U.chartScale({ hideGrid: true }),
          y: U.chartScale({ money: true })
        }
      }
    });
    App.charts.push(c);
  },

  /* ── Render tabla de deudores ── */
  renderDeudoresTable(clientes, ventas, filtro = 'conDeuda') {
    const now = Date.now();
    let lista = clientes;
    if (filtro === 'conDeuda') lista = clientes.filter(c => (c.deuda||0) > 0);
    if (filtro === 'sinDeuda') lista = clientes.filter(c => (c.deuda||0) <= 0);
    if (filtro === 'vencido') {
      // clientes con facturas a crédito > 30 días
      const vencidoIds = new Set(ventas.filter(v => v.metodoPago === 'credito' && ['credito','pagado_parcial'].includes(v.estado) && Math.floor((now - new Date(v.fecha).getTime())/86400000) > 30).map(v => v.clienteId));
      lista = clientes.filter(c => vencidoIds.has(c.id));
    }

    if (!lista.length) return `<div class="empty-state"><div class="empty-state-icon">💳</div><h3>Sin resultados</h3><p>No hay clientes que coincidan con el filtro</p></div>`;

    return `<div class="table-wrap"><table>
      <thead><tr><th>Cliente</th><th>Tipo</th><th>Teléfono</th><th>Límite Cred.</th><th>Deuda</th><th>Disponible</th><th>Última Compra</th><th>Acciones</th></tr></thead>

          <td>${U.esc(c.telefono||'—')}</td>
          <td>${U.fmt.money(c.credito||0)}</td>
          <td style="${(c.deuda||0)>0?'color:var(--red);font-weight:700':''}">${U.fmt.money(c.deuda||0)}</td>
          <td style="color:var(--green)">${U.fmt.money(disponible)}</td>
          <td style="color:var(--text3);font-size:.72rem">${ultimaCompra ? U.fmt.date(ultimaCompra.fecha) : '—'}</td>
          <td><div style="display:flex;gap:4px">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="Views.CuentasCobrar.estadoCuenta('${c.id}')" title="Estado de Cuenta">📄</button>
            ${(c.deuda||0)>0 && Auth.hasPermission('clientes.editar')?`<button class="btn btn-green btn-sm" onclick="Views.CuentasCobrar.cobrarCliente('${c.id}')">💰 Cobrar</button>`:''}
            ${Auth.hasPermission('clientes.editar') ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="Views.CuentasCobrar.modalAjustarCredito('${c.id}')" title="Ajustar límite">✏️</button>` : ''}
          </div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  },

  /* ── Filtrar deudores (búsqueda en vivo) ── */
  async filtrarDeudores(q) {
    const [clientes, ventas] = await Promise.all([DB.getAll('clientes'), DB.getAll('ventas')]);
    const filtro = U.id('cc-filtro-estado')?.value || 'conDeuda';
    let lista = clientes;
    if (q) lista = lista.filter(c => c.nombre.toLowerCase().includes(q.toLowerCase()) || (c.telefono||'').includes(q));
    const tableEl = U.id('cc-deudores-table');
    if (tableEl) tableEl.innerHTML = Views.CuentasCobrar.renderDeudoresTable(lista, ventas, filtro);
  },

  switchTab(tab, btn) {

  /* ── Procesar cobro ── */
  async procesarCobro(clienteId) {
    if (!Auth.hasPermission('clientes.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const c = await DB.get('clientes', clienteId);
    const monto = parseFloat(U.id('cob-monto')?.value || 0);
    if (monto <= 0) { Toast.error('El monto debe ser mayor a 0'); return; }
    if (monto > (c.deuda || 0)) { Toast.error(`El monto no puede superar la deuda de ${U.fmt.money(c.deuda)}`); return; }

    const metodoPago = U.id('cob-metodo')?.value || 'efectivo';
    const ref = U.id('cob-ref')?.value?.trim() || (facturaId ? `COB-${(await DB.get('ventas', facturaId))?.numero || facturaId}` : `COB-${Date.now().toString(36).toUpperCase()}`);
    const notas = U.id('cob-notas')?.value?.trim() || '';
    const facturaId = U.id('cob-factura')?.value || '';

    // Actualizar deuda del cliente
    c.deuda = Math.max(0, (c.deuda || 0) - monto);
    await DB.put('clientes', c);

    // Si se seleccionó factura específica, actualizar su estado si deuda = 0
    if (facturaId) {
      const venta = await DB.get('ventas', facturaId);
      if (venta && venta.total <= monto) {
        venta.estado = 'completada';
        await DB.put('ventas', venta);
      }
    }

    // Registrar movimiento
    await DB.put('movimientos', {
      id: U.uid(),
      tipo: 'cobro_credito',
      productoId: clienteId,
      productoNombre: `Cobro crédito: ${c.nombre}`,
      cantidad: 1,
      monto,
      metodoPago,
      referencia: ref,
      facturaId: facturaId || '',
      motivo: notas || `Cobro deuda cliente — ${metodoPago}`,
      fecha: U.now(),
      usuarioId: Auth.currentUser.id
    });

    // Notificación si deuda quedó en 0
    if (c.deuda === 0) {
      await DB.put('notificaciones', {
        id: U.uid(), tipo: 'cobro_credito',
        titulo: 'Deuda saldada',
        mensaje: `${c.nombre} ha saldado su deuda completamente`,
        leida: false, fecha: U.now()
      });
    }

    App.closeModal();
    Toast.success(`✅ Cobro registrado: ${U.fmt.money(monto)} · Deuda restante: ${U.fmt.money(c.deuda)}`);
    AppAudio.saleCashier();
    await Views.CuentasCobrar.render();
  },

    const ref = U.id('cof-ref')?.value?.trim() || `COB-${v.numero || ventaId}`;

    // Actualizar venta
    if (monto >= v.total) { v.estado = 'completada'; v.pagado = v.total; }
    else { v.pagadoParcial = (v.pagadoParcial || 0) + monto; }
    await DB.put('ventas', v);

    // Actualizar deuda cliente
    c.deuda = Math.max(0, (c.deuda||0) - monto);
    await DB.put('clientes', c);

    // Log
    await DB.put('movimientos', {
      id: U.uid(), tipo: 'cobro_credito',
      productoId: clienteId, productoNombre: `Cobro crédito: ${c.nombre}`,

    const cfg = await DB.get('configuracion', 'config') || {};

const AppAudio = {
  ctx: null,
  getCtx() { if (!AppAudio.ctx) AppAudio.ctx = new (window.AudioContext||window.webkitAudioContext)(); return AppAudio.ctx; },

  beep(freq = 880, dur = 0.12, vol = 0.3, type = 'sine') {
    try {
      const ctx = AppAudio.getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  },

  saleCashier() {
    // Pleasant "ka-ching" style: ascending two tones
    AppAudio.beep(523, 0.08, 0.25);
    setTimeout(() => AppAudio.beep(784, 0.15, 0.3), 80);
    setTimeout(() => AppAudio.beep(1047, 0.2, 0.25), 180);
  },

  scanSuccess() { AppAudio.beep(1200, 0.06, 0.2); },
  scanFail()    { AppAudio.beep(200, 0.15, 0.2, 'sawtooth'); },
  alert()       { AppAudio.beep(440, 0.1, 0.2); setTimeout(() => AppAudio.beep(440, 0.1, 0.2), 150); }
};

V.familiasOlfativas = ['Cítrico','Fresco especiado','Aromático','Dulce','Amaderado','Afrutado','Caramelo','Lavanda','Ámbar','Cálido especiado'];
V.normalizarFamilias = function(v) {
  if (Array.isArray(v)) return [...new Set(v.map(x=>String(x).trim()).filter(Boolean))];
  if (!v) return [];
  try { const a=JSON.parse(v); if(Array.isArray(a)) return [...new Set(a.map(x=>String(x).trim()).filter(Boolean))]; } catch(e) {}
  return [...new Set(String(v).split(',').map(x=>x.trim()).filter(Boolean))];
};
V.getPagos = function(v) {
  if (!v) return [];
  if (Array.isArray(v.pagos)) return v.pagos.filter(p=>p && p.estado!=='anulado' && Number(p.monto)>0);
  const total=Number(v.total||0);
  const legacy = v.estado==='credito' || v.estado==='pagado_parcial' ? Number(v.pagadoParcial||0) : Number(v.pagado||0);
  const monto=Math.min(Math.max(0,legacy),Math.max(0,total));
  return monto>0 ? [{id:'legacy',monto,metodo:v.metodoPago||'efectivo',fecha:v.fecha,estado:'activo'}] : [];
};
V.getPagado = function(v) { return Math.min(Math.max(0,Number(v?.total||0)), V.getPagos(v).reduce((s,p)=>s+Number(p.monto||0),0)); };
V.getSaldo = function(v) { return Math.max(0, Number(v?.total||0)-V.getPagado(v)); };
V.syncEstadoVenta = function(v) {
  const pagado=V.getPagado(v), total=Number(v.total||0);
  v.pagado=pagado;
  v.pagadoParcial=pagado;
  if(v.estado!=='anulada' && v.estado!=='cotizacion' && v.estado!=='vendido') {
    v.estado = pagado >= total-0.01 ? 'completada' : (pagado>0 ? 'pagado_parcial' : 'credito');
  }
  return v;
};
V.addPago = function(v,monto,metodo,ref='') {
  if(!Array.isArray(v.pagos)) v.pagos=[];
  v.pagos.push({id:U.uid(),monto:Number(monto),metodo,referencia:ref||null,fecha:U.now(),usuarioId:Auth.currentUser?.id||null,estado:'activo'});
  V.syncEstadoVenta(v);
  return v;
};
V.anularPagos = function(v) { if(Array.isArray(v.pagos)) v.pagos.forEach(p=>{p.estado='anulado';p.anuladaFecha=U.now();p.anuladaPor=Auth.currentUser?.id||null;}); };
V.esVentaActiva = function(v) { return !!(v && !['anulada','cotizacion','devolucion','vendido','devuelta'].includes(v.estado) && Number(v.total||0)>0); };

// POS: pago correcto (el cambio nunca se registra como ingreso), crédito y fidelización.
// Protección local contra doble clic/doble ejecución. La protección definitiva debe estar en Supabase.
Views.POS._processingSale = false;
Views.POS.processSale = async function() {
  if (Views.POS._processingSale) { Toast.warning('La venta ya se está procesando. Espera un momento.'); return; }
  Views.POS._processingSale = true;
  try {
    const pending=Views.POS._pending||{};
    const {method,total,subtotal,descAmt,tipoEntrega,costoDelivery,delivery}=pending;
    if(!method) return;
    Views.POS._pending=null;

    const clienteNombre=U.id('cart-cliente')?.value?.trim()||'Cliente General';
    const cliId=delivery?.clienteId||Views.POS._clienteId||'';
    const recv=method==='efectivo'?Number(pending.cashReceived||0):total;

    if(method==='efectivo' && (!Number.isFinite(recv)||recv<total)){
      Views.POS._pending=pending;
      Toast.error('El efectivo recibido es menor que el total.');
      return;
    }
    if(method==='credito'&&!cliId){
      Views.POS._pending=pending;
      Toast.error('Para una venta a crédito debes seleccionar un cliente.');
      return;
    }

    const cfg=await DB.get('configuracion','config')||{};
    const cambio=method==='efectivo'?Math.max(0,recv-total):0;
    const items=Views.POS.cart.map(i=>({
      id:i.id,
      nombre:i.nombre,
      precio:Number(i.precio||0),
      qty:Number(i.qty||0),
      total:Number(i.precio||0)*Number(i.qty||0)
    }));

    const ventaPayload={
      id: U.uid(),
      clienteid: delivery?.clienteId || cliId || null,
      clientenombre: delivery?.clienteNombre || clienteNombre,
      items,
      subtotal:Number(subtotal||0),
      descuento:Number(descAmt||0),
      total:Number(total||0),
      // El dinero recibido puede incluir cambio; el monto pagado de la factura es el total.
      pagado: method==='credito' ? 0 : Number(total||0),
      pagadoparcial:0,
      cambio,
      metodopago:method,
      fecha:U.now(),
      pagos: method==='credito' ? [] : [{monto:Number(total||0),metodoPago:method}],
      notas: tipoEntrega==='agencia' && delivery
        ? `Envío por agencia · Agencia: ${delivery.agencia} · Cliente: ${delivery.clienteNombre} · Tel: ${delivery.telefono} · Dirección: ${delivery.direccion} · Sector: ${delivery.sector} · Referencia: ${delivery.referencia} · Costo envío: ${U.fmt.money(costoDelivery||0)}`
        : tipoEntrega==='delivery' ? `Delivery · Costo: ${U.fmt.money(costoDelivery||0)}` : 'Retiro en tienda'
    };

    const deliveryPayload = (tipoEntrega==='delivery' && delivery) ? {
      id: U.uid(),
      clienteid: delivery.clienteId || cliId || null,
      clientenombre: delivery.clienteNombre || clienteNombre,
      telefono: delivery.telefono || '',
      direccion: delivery.direccion || '',
      sector: delivery.sector || '',
      referencia: delivery.referencia || '',
      items: Views.POS.cart.map(i=>({id:i.id,nombre:i.nombre,precio:i.precio,qty:i.qty})),
      costodelivery:Number(costoDelivery||0)
    } : null;

    // La venta, numeración, stock, movimientos, crédito y delivery se procesan
    // de forma atómica en Supabase. El frontend NO escribe directamente estas tablas.
    const {data:rpcData,error:rpcError}=await DB.client.rpc('registrar_venta_segura',{
      p_venta:ventaPayload,
      p_delivery:deliveryPayload
    });
    if(rpcError) throw rpcError;

    const result=typeof rpcData==='string'?JSON.parse(rpcData):rpcData;
    if(!result?.ok) throw new Error(result?.message||'Supabase no confirmó la venta.');

    const venta={
      ...ventaPayload,
      id:result.id,
      numero:result.numero,
      estado:result.estado,
      usuarioId:Auth.currentUser.id,
      clienteId:delivery?.clienteId||cliId,
      clienteNombre:delivery?.clienteNombre||clienteNombre,
      tipoEntrega:tipoEntrega||'retiro',
      costoDelivery:Number(costoDelivery||0),
      delivery:delivery||null,
      pagado:method==='credito'?0:Number(total||0),
      pagadoParcial:0,
      puntosGenerados:0
    };

    Views.POS.cart=[];
    Views.POS._clienteId='';
    if(U.id('cart-cliente'))U.id('cart-cliente').value='';
    Toast.success(`Factura ${result.numero} generada · ${U.fmt.money(total)}`);
    if(cambio>0)Toast.info(`Cambio: ${U.fmt.money(cambio)}`);
    if(tipoEntrega==='delivery'&&delivery)Toast.success(`🚚 Delivery ${result.numero} creado automáticamente`);
    if(tipoEntrega==='agencia'&&delivery)Toast.success(`📦 Envío por agencia ${result.numero} registrado`);

    setTimeout(()=>App.openModal(`Factura ${result.numero} generada`,`<div style="text-align:center;padding:12px"><div style="font-size:2.4rem">✅</div><h3>Venta registrada correctamente</h3><p class="text-muted">${U.esc(result.numero)} · ${U.fmt.money(total)}</p></div>`,`<button class="btn btn-secondary" onclick="App.closeModal()">Cerrar</button><button class="btn btn-primary" onclick="Views.Ventas.printFactura('${U.esc(result.id)}')">🖨️ Imprimir A4</button>`),100);
    AppAudio.saleCashier();
    await Views.POS.render();
  } catch (e) {
    console.error('[POS.processSale]', e);
    Toast.error(`No se pudo completar la venta: ${e?.message || 'error desconocido'}`);
  } finally {
    Views.POS._processingSale = false;
  }
};

  if(!c||monto<=0||monto>Number(c.deuda||0)+0.01){Toast.error('Monto inválido');return;}
  let restante=monto; const ventas=(await DB.getAll('ventas')).filter(v=>v.clienteId===id&&['credito','pagado_parcial'].includes(v.estado)&&V.esVentaActiva(v)).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  for(const v of ventas){if(restante<=0)break;const saldo=V.getSaldo(v);if(saldo<=0)continue;const aplicar=Math.min(restante,saldo);V.addPago(v,aplicar,metodo,`COB-${Date.now().toString(36).toUpperCase()}`);const cfg=await DB.get('configuracion','config')||{};const tasa=Number(cfg.puntosPorRD||100);const cli=await DB.get('clientes',id);const nuevos=Math.max(0,Math.floor(V.getPagado(v)/tasa)-Number(v.puntosGenerados||0));if(cli&&nuevos){cli.puntos=Number(cli.puntos||0)+nuevos;v.puntosGenerados=Number(v.puntosGenerados||0)+nuevos;await DB.put('clientes',cli);}await DB.put('ventas',v);await DB.put('movimientos',{id:U.uid(),tipo:'cobro_credito',productoId:id,productoNombre:`Cobro crédito: ${c.nombre}`,cantidad:1,monto:aplicar,metodoPago:metodo,referencia:`COB-${v.numero}`,facturaId:v.id,motivo:`Cobro factura ${v.numero} — ${metodo}`,fecha:U.now(),usuarioId:Auth.currentUser.id});restante-=aplicar;}
  c.deuda=Math.max(0,Number(c.deuda||0)-monto+restante);await DB.put('clientes',c);App.closeModal();Toast.success(`Cobro registrado: ${U.fmt.money(monto-restante)}`);await Views.CuentasCobrar.render();
};

Views.CuentasCobrar.procesarCobroFactura = async function(ventaId,clienteId){
  if(!Auth.hasPermission('clientes.editar')){Toast.error('Sin permiso');return;}
  const [v,c]=await Promise.all([DB.get('ventas',ventaId),DB.get('clientes',clienteId)]); if(!v||!c||!V.esVentaActiva(v)){Toast.error('Factura no disponible para cobro');return;}
  const monto=Number(U.id('cof-monto')?.value||0), saldo=V.getSaldo(v), metodo=U.id('cof-metodo')?.value||'efectivo',ref=U.id('cof-ref')?.value?.trim()||`COB-${Date.now().toString(36).toUpperCase()}`;
  if(monto<=0||monto>saldo+0.01){Toast.error(`El máximo a cobrar es ${U.fmt.money(saldo)}`);return;}
  V.addPago(v,Math.min(monto,saldo),metodo,ref); const cfg=await DB.get('configuracion','config')||{}; const tasa=Number(cfg.puntosPorRD||100); const nuevos=Math.max(0,Math.floor(V.getPagado(v)/tasa)-Number(v.puntosGenerados||0)); if(nuevos){c.puntos=Number(c.puntos||0)+nuevos;v.puntosGenerados=Number(v.puntosGenerados||0)+nuevos;}
  await DB.put('ventas',v); c.deuda=Math.max(0,Number(c.deuda||0)-Math.min(monto,saldo)); await DB.put('clientes',c);
  await DB.put('movimientos',{id:U.uid(),tipo:'cobro_credito',productoId:clienteId,productoNombre:`Cobro crédito: ${c.nombre}`,cantidad:1,monto:Math.min(monto,saldo),metodoPago:metodo,referencia:ref,facturaId:ventaId,motivo:`Cobro factura ${v.numero} — ${metodo}`,fecha:U.now(),usuarioId:Auth.currentUser.id});
  App.closeModal();Toast.success(`Cobro aplicado: ${U.fmt.money(Math.min(monto,saldo))} · ${V.estadoBadge(v.estado).replace(/<[^>]+>/g,'')}`);await Views.CuentasCobrar.render();
};




/* ─── ELIMINACIÓN DEL MÓDULO CATEGORÍAS ─── */
(function(){
  // El módulo administrativo de Categorías fue retirado.
  delete Views.Categorias;
  if (Array.isArray(NAV_ITEMS)) {
    NAV_ITEMS = NAV_ITEMS.filter(x => x.view !== 'categorias');
  }

  // POS: sin pestañas/filtros de categoría.
  const _posRender = Views.POS.render;
  Views.POS.render = async function(){
    await _posRender.apply(this, arguments);
    const el = document.getElementById('pos-cats');
    if (el) el.remove();
  };
  const _posFilterProducts = Views.POS.filterProducts;
  Views.POS.filterProducts = function(q){
    q = (q || '').toLowerCase();
    let filtered = Views.POS.allProducts || [];
    if (q) filtered = filtered.filter(p => U.matchProducto(p, q));
    const grid = U.id('pos-grid');
    if (grid) grid.innerHTML = Views.POS.renderProductCards(filtered);
  };
  Views.POS.filterCat = function(){};

  // Inventario: elimina el selector de categoría del filtro y el campo del formulario.
  const _invRenderTable = Views.Inventario.renderTable;
  Views.Inventario.renderTable = async function(){
    const result = await _invRenderTable.apply(this, arguments);
    const cat = U.id('inv-cat');
    if (cat) cat.remove();
    document.querySelectorAll('#view-area select').forEach(el => {
      if ((el.previousElementSibling?.textContent || '').toLowerCase().includes('categoría')) el.parentElement.remove();
    });
    document.querySelectorAll('#view-area table').forEach(table => {
      const ths = [...table.querySelectorAll('thead th')];
      const idx = ths.findIndex(th => th.textContent.trim().toLowerCase() === 'categoría');
      if (idx >= 0) {
        table.querySelectorAll('tr').forEach(tr => tr.children[idx]?.remove());
      }
    });
    return result;
  };

  const _invModal = Views.Inventario.modalProducto;
  Views.Inventario.modalProducto = async function(){
    const r = await _invModal.apply(this, arguments);
    const cat = U.id('p-cat');
    if (cat) {
      cat.value = '';
      cat.parentElement.remove();
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.id = 'p-cat';
      hidden.value = '';
      U.id('modal-body')?.appendChild(hidden);
    }
    return r;
  };

  // Compatibilidad: si el guardado/importación antiguo espera p-cat, se mantiene
  // el dato vacío sin mostrar ni administrar categorías.
  const _invExport = Views.Inventario.exportCSV;
  Views.Inventario.exportCSV = async function(){
    const prods = await DB.getAll('productos');
    const headers = ['Nombre','Marca','Precio','Costo','Stock','StockMin','Unidad'];
    const rows = prods.map(p => [p.nombre||'',p.marca||'',p.precio||0,p.costo||0,p.stock||0,p.stockMin||0,p.unidad||'']);
    const csv = [headers,...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='inventario_jm_aromas.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  // Conteo físico: sin clasificación por categoría.
  const _conteoRender = Views.Conteo?.render;
  if (_conteoRender) Views.Conteo.render = async function(){
    await _conteoRender.apply(this, arguments);
    document.querySelectorAll('#view-area select').forEach(el => {
      if ((el.previousElementSibling?.textContent || '').toLowerCase().includes('categoría')) el.parentElement.remove();
    });
  };

  // Promociones: se conserva alcance por género/producto/todo, pero no por categoría.
  const _movRender = Views.Movimientos.renderTable;
  Views.Movimientos.renderTable = async function(){
    await _movRender.apply(this, arguments);
    document.querySelectorAll('#view-area *').forEach(el => {
      if (el.children.length===0 && el.textContent.trim().toLowerCase().startsWith('categoría:')) {
        el.textContent = 'Promoción';
      }
    });
  };
  const _movModal = Views.Movimientos.modalPromocion;
  if (_movModal) Views.Movimientos.modalPromocion = async function(){
    await _movModal.apply(this, arguments);
    const tipo = U.id('promo-alcance-tipo');
    if (tipo) {
      [...tipo.options].forEach(o => { if (o.value === 'categoria') o.remove(); });
      if (tipo.value === 'categoria') tipo.value = 'todo';
      tipo.dispatchEvent(new Event('change'));
    }
    const wrap = U.id('promo-alcance-categoria-wrap');
    if (wrap) wrap.remove();
  };
})();


/* ─── AJUSTES DE CATÁLOGO J&M AROMAS ─── */
(function(){
  // Categorías: retiradas de la gestión y de todos los filtros/formularios visibles.
  if (typeof Views !== 'undefined') {
    delete Views.Categorias;
  }
  if (Array.isArray(NAV_CONFIG)) {
    for (let i = NAV_CONFIG.length - 1; i >= 0; i--) {
      if (NAV_CONFIG[i].view === 'categorias') NAV_CONFIG.splice(i,1);
    }
  }

  // Productos: solo búsqueda y estado de stock en la APP.
  const originalRenderTable = Views.Inventario.renderTable;
  Views.Inventario.renderTable = async function(q = '', filtroStock = 'todos') {
    const result = await originalRenderTable.call(this, q, filtroStock);

    const cat = U.id('inv-cat');
    if (cat) cat.remove();

    // Eliminar cualquier control de categoría que haya quedado en la vista.
    document.querySelectorAll('#view-area *').forEach(el => {
      if (el.children.length === 0 && /^categor[ií]a$/i.test(el.textContent.trim())) {
        const parent = el.closest('.form-group, .filter-bar');
        if (parent) parent.remove();
      }
    });

    // Eliminar chips de género/tipo antiguos y reemplazarlos por una sola lista.
    const chips = document.querySelector('#view-area .filter-chips');
    if (chips) chips.remove();

    return result;
  };

  // Modal de producto: limpieza defensiva para que no queden campos retirados.
  const originalModalProducto = Views.Inventario.modalProducto;
  Views.Inventario.modalProducto = async function(){
    const r = await originalModalProducto.apply(this, arguments);
    // Solo retirar campos de categorías/SKU/barcode. Familia olfativa se conserva (capa v8).
    ['p-cat','p-barcode'].forEach(id => {
      const el = U.id(id);
      if (el) el.closest('.form-group, .form-row')?.remove();
    });
    return r;
  };

  // Notificaciones: módulo retirado de la navegación y de la configuración.
  delete Views.Notificaciones;
  if (App.startNotifCheck) App.startNotifCheck = async function(){};
})();



/* ─── BOOT ─── */
document.addEventListener('DOMContentLoaded', () => App.init());
</script>

<script>
/* ═══ PWA: Service Worker + instalación + estado de conexión ═══ */
(function(){
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  let deferredPrompt = null;

  // Estilos de los avisos PWA (autocontenidos, no tocan el resto del sistema)
  const st = document.createElement('style');
  st.textContent = `
    .pwa-toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(16px + env(safe-area-inset-bottom));z-index:99999;
      background:#26241f;color:#F0E7CA;border:1px solid rgba(223,207,174,.28);border-radius:14px;padding:11px 14px;font:500 .8rem Inter,system-ui,sans-serif;
      box-shadow:0 12px 48px rgba(0,0,0,.7);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);opacity:0;pointer-events:none;transition:all .25s}
    .pwa-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
    .pwa-toast button{border:0;border-radius:9px;padding:7px 12px;font:700 .75rem Inter,system-ui,sans-serif;cursor:pointer;background:linear-gradient(135deg,#ECDFC0,#C9A876);color:#121110}
    .pwa-toast .pwa-x{background:transparent;color:#B8AD96;padding:4px 6px;font-size:1rem;line-height:1}
    .pwa-offline{position:fixed;top:0;left:0;right:0;z-index:99998;background:#c98f5c;color:#121110;text-align:center;font:700 .72rem Inter,system-ui,sans-serif;
      padding:calc(4px + env(safe-area-inset-top)) 8px 4px;letter-spacing:.04em;display:none}
    .pwa-offline.show{display:block}`;
  document.head.appendChild(st);

  function toast(html, actions){
    let el = document.getElementById('pwa-toast');
    if(!el){ el = document.createElement('div'); el.id='pwa-toast'; el.className='pwa-toast'; document.body.appendChild(el); }
    el.innerHTML = '<span>'+html+'</span>';
    (actions||[]).forEach(a=>{
      const b=document.createElement('button'); b.textContent=a.label; b.className=a.cls||''; b.onclick=()=>{ a.fn&&a.fn(); if(a.close!==false) el.classList.remove('show'); }; el.appendChild(b);
    });
    requestAnimationFrame(()=>el.classList.add('show'));
    return el;
  }

  // Indicador sin conexión
  const off = document.createElement('div'); off.className='pwa-offline';
  off.textContent='Sin conexión — las ventas y consultas requieren Internet';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(off));
  const upd = () => off.classList.toggle('show', !navigator.onLine);
  window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();

  // Service Worker + aviso de nueva versión
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        const ask = w => toast('Hay una nueva versión de J&M Aromas.', [
          {label:'Actualizar', fn:()=>w.postMessage('SKIP_WAITING')},
          {label:'×', cls:'pwa-x'}
        ]);
        if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          w && w.addEventListener('statechange', () => { if (w.state==='installed' && navigator.serviceWorker.controller) ask(w); });
        });
        setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
      }).catch(err => console.warn('[PWA] Service Worker no disponible:', err));
      let reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloaded) return; reloaded=true; location.reload(); });
    });
  }

  // Instalación (Android/Chrome/Edge/escritorio)
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    if (isStandalone() || localStorage.getItem('jm_pwa_dismiss')) return;
    setTimeout(()=>toast('Instala J&M Aromas como app en este dispositivo.', [
      {label:'Instalar', fn:async()=>{ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }},
      {label:'×', cls:'pwa-x', fn:()=>localStorage.setItem('jm_pwa_dismiss','1')}
    ]), 4000);
  });
  window.addEventListener('appinstalled', () => { deferredPrompt=null; toast('App instalada correctamente.', [{label:'OK'}]); });

  // iOS Safari no dispara beforeinstallprompt: instrucciones manuales
  if (isIOS && !isStandalone() && !localStorage.getItem('jm_pwa_dismiss')) {
    window.addEventListener('load', () => setTimeout(()=>toast('Para instalar: toca Compartir y luego "Agregar a pantalla de inicio".', [
      {label:'Entendido', fn:()=>localStorage.setItem('jm_pwa_dismiss','1')}
    ]), 5000));
  }

  // Función para instalar desde un botón propio: window.JM_PWA.install()
  window.JM_PWA = { canInstall:()=>!!deferredPrompt, isStandalone,
    install: async()=>{ if(!deferredPrompt) return false; deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; deferredPrompt=null; return r.outcome==='accepted'; } };
})();
</script>
