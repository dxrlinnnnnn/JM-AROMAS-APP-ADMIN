  async checkStockAlerts() {
    const productos = await DB.getAll('productos');
    const notifExist = await DB.getAll('notificaciones');
    // Dedup: only create one unread notification per product per type
    const existingKeys = new Set(notifExist.filter(n => !n.leida).map(n => n._key || ''));
    for (const p of productos) {
      if (p.stock <= 0) {
        const key = `agotado:${p.id}`;
        if (!existingKeys.has(key)) {
          await DB.put('notificaciones', { id: U.uid(), _key: key, tipo: 'stock_agotado', titulo: 'Producto agotado', mensaje: `${p.nombre} está agotado`, leida: false, fecha: U.now() });
        }
      } else if (p.stock <= p.stockMin) {
        const key = `bajo:${p.id}`;
        if (!existingKeys.has(key)) {
          await DB.put('notificaciones', { id: U.uid(), _key: key, tipo: 'stock_bajo', titulo: 'Stock bajo', mensaje: `${p.nombre}: ${p.stock} und (mín: ${p.stockMin})`, leida: false, fecha: U.now() });
        }
      } else if (p.stockMax && p.stock > p.stockMax) {
        const key = `sobrestock:${p.id}`;
        if (!existingKeys.has(key)) {
          await DB.put('notificaciones', { id: U.uid(), _key: key, tipo: 'stock_sobrante', titulo: 'Stock por encima del máximo', mensaje: `${p.nombre}: ${p.stock} und (máx: ${p.stockMax})`, leida: false, fecha: U.now() });
        }
      }
    }
  },

  async getNextCotizacionNumero() {
    const cfg = await DB.get('configuracion','config') || {};
    const prefix = cfg.cotizPrefix || 'COT';
    const ventas = await DB.getAll('ventas');
    const prefixUpper = String(prefix).toUpperCase();
    let max = 0;
    for (const v of ventas) {
      const raw = String(v.numero || '');
      const upper = raw.toUpperCase();
      if (!upper.startsWith(prefixUpper + '-')) continue;
      const n = Number(raw.slice(String(prefix).length + 1));
      if (Number.isInteger(n) && n > max) max = n;
    }

    let n = max + 1;
    while (ventas.some(v => String(v.numero || '').toUpperCase() === `${prefix}-${String(n).padStart(4,'0')}`.toUpperCase())) n++;
    return `${prefix}-${String(n).padStart(4,'0')}`;
  },

    if (!Views.POS.cart.length) { Toast.error('El carrito está vacío'); return; }
    const cliId = U.id('cot-cliente')?.value;
    const clientes = await DB.getAll('clientes');
    const cli = clientes.find(c => c.id === cliId);
    const num = window._cotDraftNumero && !(await DB.getAll('ventas')).some(v => String(v.numero || '').toUpperCase() === String(window._cotDraftNumero).toUpperCase())

      : await Views.POS.getNextCotizacionNumero();
    const validezDias = Math.max(1, parseInt(U.id('cot-dias')?.value || 15, 10));
    const items = Views.POS.cart.map(i => ({ ...i, total: i.qty * i.precio }));
    const subtotal = items.reduce((s,i) => s + i.total, 0);
    const tipoEntrega = U.id('cot-entrega')?.value || 'retiro';
    const costoDelivery = tipoEntrega === 'delivery' ? Math.max(0, parseFloat(U.id('cot-delivery')?.value || 0)) : 0;
    const total = subtotal + costoDelivery;

    await DB.put('ventas', {

      clienteId: cliId || '', clienteNombre: cli?.nombre || 'Cliente General',
      items, subtotal, descuento: 0, total,

      estado: 'cotizacion',
      validezDias,
      notas: U.id('cot-notas')?.value || '',

    App.closeModal();
    window._cotDraftNumero = null;
    Toast.success(`${num} guardada · ${U.fmt.money(total)}`);

  async showDevoluciones() {
    const ventas = (await DB.getAll('ventas')).filter(v => ['completada','credito','pagado_parcial','parcialmente_devuelta'].includes(v.estado) && V.esVentaActiva(v)).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
    const opts = ventas.slice(0,50).map(v => `<option value="${v.id}">${U.esc(v.numero)} — ${U.esc(v.clienteNombre||'General')} — ${U.fmt.money(v.total)}</option>`).join('');
    App.openModal('Registrar Devolución', `
      <div class="form-group"><label class="form-label">Venta original *</label><select class="form-control" id="dev-venta" onchange="Views.POS.loadDevItems(this.value)"><option value="">Seleccionar venta...</option>${opts}</select></div>
      <div id="dev-items" style="margin-top:8px"></div>
      <div class="form-group mt-12"><label class="form-label">Motivo de devolución *</label><select class="form-control" id="dev-motivo"><option>Producto defectuoso</option><option>Producto incorrecto</option><option>Cliente cambió de opinión</option><option>Daño en transporte</option><option>Otro</option></select></div>
      <div class="form-group"><label class="form-label">Notas adicionales</label><textarea class="form-control" id="dev-notas" rows="2"></textarea></div>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button><button class="btn btn-danger" onclick="Views.POS.processDevolucion()">↩️ Procesar Devolución</button>`);
    window._devItems = []; window._devVenta = null;
  },

  async loadDevItems(ventaId) {
    if (!ventaId) return;
    const v = await DB.get('ventas', ventaId);
    if (!v || !V.esVentaActiva(v)) return;
    window._devVenta = v;
    window._devItems = (v.items||[]).map(i => ({ ...i, devQty: Number(i.qty||0) })).filter(i => i.devQty > 0);
    U.id('dev-items').innerHTML = `
      <div style="font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:6px">Productos disponibles para devolución:</div>
      <table class="cot-items-table"><thead><tr><th>Producto</th><th>Disponible</th><th>A devolver</th><th>Total</th></tr></thead>
      <tbody>${window._devItems.map((it,i) => `<tr><td>${U.esc(it.nombre)}</td><td>${it.qty}</td><td><input type="number" min="0" max="${it.qty}" value="${it.qty}" style="width:60px;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;color:var(--text1);padding:2px 5px;text-align:center" onchange="window._devItems[${i}].devQty=Math.min(${it.qty},Math.max(0,+this.value));Views.POS.updateDevTotal()"/></td><td id="dev-sub-${i}">${U.fmt.money(it.qty*it.precio)}</td></tr>`).join('')}</tbody></table>
      <div class="flex justify-between mt-8" style="font-weight:700;padding:8px;background:var(--bg3);border-radius:var(--radius)"><span>Total a devolver</span><span id="dev-total" style="color:var(--red)">${U.fmt.money((window._devItems||[]).reduce((s,i)=>s+i.devQty*i.precio,0))}</span></div>`;
  },

  updateDevTotal() {
    if (!window._devItems) return;
    const total = window._devItems.reduce((s,i) => s + Number(i.devQty||0) * Number(i.precio||0), 0);
    const el = U.id('dev-total'); if (el) el.textContent = U.fmt.money(total);
    window._devItems.forEach((it,i) => { const sub=U.id(`dev-sub-${i}`); if(sub) sub.textContent=U.fmt.money(Number(it.devQty||0)*Number(it.precio||0)); });
  },

  async processDevolucion() {
    const ventaId = U.id('dev-venta')?.value;
    const items = (window._devItems||[]).filter(i => Number(i.devQty||0) > 0).map(i => ({ id:i.id, qty:Number(i.devQty), precio:Number(i.precio||0) }));
    if (!ventaId || !items.length) { Toast.error('Selecciona una venta y al menos un producto'); return; }
    const motivo = U.id('dev-motivo')?.value || 'Sin motivo';
    const notas = U.id('dev-notas')?.value || '';
    try {
      const { data, error } = await DB.client.rpc('registrar_devolucion_segura', { p_venta_id: ventaId, p_items: items, p_motivo: motivo, p_notas: notas });
      if (error) throw error;
      const result = typeof data === 'string' ? JSON.parse(data) : data;
      if (!result?.ok) throw new Error(result?.message || 'La devolución fue rechazada por Supabase.');
      App.closeModal(); window._devItems=[]; window._devVenta=null;
      Toast.success(result.message || `Devolución ${result.numero || ''} procesada correctamente`);
      await Views.Ventas.render();
    } catch (e) { console.error('[registrar_devolucion_segura]',e); Toast.error(`No se pudo procesar la devolución: ${e.message||'error del servidor'}`); }
  }

};

  async verKardex(id) {
    const p = await DB.get('productos', id);
    if (!p) return;
    const movs = (await DB.getAll('movimientos'))
      .filter(m => m.productoId === id)
      .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

    // Reconstruye el saldo valorizado por costo promedio ponderado.
    // 'transferencia' no cambia el stock total de la empresa (solo mueve
    // entre ubicaciones), así que no afecta el saldo aquí.
    let saldo = 0, costoProm = p.costo || 0, valor = 0;
    const filas = movs.map(m => {
      let entrada = 0, salida = 0;
      if (m.tipo === 'entrada') {
        entrada = m.cantidad;
        const costoUnit = m.costo != null ? m.costo : costoProm;
        valor += entrada * costoUnit;
        saldo += entrada;
        costoProm = saldo > 0 ? valor / saldo : costoUnit;
      } else if (m.tipo === 'salida') {
        salida = Math.min(m.cantidad, saldo);
        valor -= salida * costoProm;
        saldo -= salida;
      } else if (m.tipo === 'ajuste') {
        const nuevoSaldo = m.cantidad;
        const delta = nuevoSaldo - saldo;
        if (delta > 0) { entrada = delta; valor += delta * costoProm; }
        else if (delta < 0) { salida = -delta; valor -= salida * costoProm; }
        saldo = nuevoSaldo;
      } else {
        return null; // transferencias, etc. — no afectan el saldo total
      }
      valor = Math.max(0, valor);
      return { fecha: m.fecha, tipo: m.tipo, motivo: m.motivo, referencia: m.referencia, entrada, salida, costoProm, saldo, valor };
    }).filter(Boolean).reverse(); // más reciente primero

    const tipoLabel = { entrada: '⬆️ Entrada', salida: '⬇️ Salida', ajuste: '⚖️ Ajuste' };

    App.openModal(`Kardex — ${U.esc(p.nombre)}`, `
      <div class="stats-grid stats-grid-3" style="margin-bottom:12px">
        <div class="stat-card"><div class="stat-label">Stock Actual</div><div class="stat-value">${p.stock}</div></div>
        <div class="stat-card blue"><div class="stat-label">Costo Promedio</div><div class="stat-value" style="font-size:.95rem">${U.fmt.money(costoProm)}</div></div>
        <div class="stat-card green"><div class="stat-label">Valor en Stock</div><div class="stat-value" style="font-size:.95rem">${U.fmt.money(saldo * costoProm)}</div></div>
      </div>
      ${filas.length ? `
      <div class="table-wrap" style="max-height:400px;overflow-y:auto">
        <table style="font-size:.75rem;width:100%">
          <thead><tr style="position:sticky;top:0;background:var(--bg2)">
            <th style="text-align:left;padding:6px">Fecha</th><th style="text-align:left;padding:6px">Tipo</th>
            <th style="text-align:left;padding:6px">Referencia</th>
            <th style="text-align:right;padding:6px">Entrada</th><th style="text-align:right;padding:6px">Salida</th>
            <th style="text-align:right;padding:6px">Costo Prom.</th><th style="text-align:right;padding:6px">Saldo</th><th style="text-align:right;padding:6px">Valor</th>
          </tr></thead>
          <tbody>${filas.map(f => `<tr>
            <td style="padding:6px">${U.fmt.date(f.fecha)}</td>
            <td style="padding:6px">${tipoLabel[f.tipo] || U.esc(f.tipo)}</td>
            <td style="padding:6px;color:var(--text3)">${U.esc(f.referencia || f.motivo || '—')}</td>
            <td style="padding:6px;text-align:right;color:var(--green)">${f.entrada ? '+'+f.entrada : ''}</td>
            <td style="padding:6px;text-align:right;color:var(--red)">${f.salida ? '−'+f.salida : ''}</td>
            <td style="padding:6px;text-align:right">${U.fmt.money(f.costoProm)}</td>
            <td style="padding:6px;text-align:right;font-weight:700">${f.saldo}</td>
            <td style="padding:6px;text-align:right">${U.fmt.money(f.valor)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>` : `<div class="empty-state"><div class="empty-state-icon">📊</div><h3>Sin movimientos registrados</h3><p>Este producto no tiene historial de entradas/salidas aún</p></div>`}
      <div style="margin-top:10px;font-size:.7rem;color:var(--text3)">Costeo por promedio ponderado. Las transferencias entre ubicaciones no alteran el saldo total.</div>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cerrar</button>`
    );
  },

  previewImagen(input) {
    const file = input?.files?.[0];
    const preview = U.id('p-imagen-preview');
    if (!file || !preview) return;
    if (!file.type.startsWith('image/')) { Toast.error('Selecciona una imagen válida'); input.value=''; return; }
    if (file.size > 2 * 1024 * 1024) { Toast.error('La imagen no puede superar 2 MB'); input.value=''; return; }
    const reader = new FileReader();
    reader.onload = e => {
      preview.innerHTML = `<img src="${e.target.result}" alt="Vista previa" style="width:100%;height:100%;object-fit:cover"/>`;
    };
    reader.readAsDataURL(file);
  },

  async subirImagenProducto(id, file) {
    if (!file) return U.id('p-imagen')?.value || null;
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path = `${id}.${ext}`;
    const { data, error } = await DB.client.storage.from('productos').upload(path, file, { upsert: true, contentType: file.type, cacheControl: '3600' });
    if (error) throw new Error(`No se pudo subir la foto: ${error.message}`);
    const { data: pub } = DB.client.storage.from('productos').getPublicUrl(data.path);
    return pub?.publicUrl || null;
  },

  async saveProducto(id) {
    if (!Auth.hasPermission(id ? 'inventario.editar' : 'inventario.crear')) { Toast.error('No tienes permiso para esta acción'); return; }
    const nombre = U.id('p-nombre').value.trim();
    if (!nombre) { Toast.error('El nombre es obligatorio'); return; }
    const precio = parseFloat(U.id('p-precio').value) || 0;
    if (precio <= 0) { Toast.error('El precio debe ser mayor a 0'); return; }

    const tipoCatalogo = U.id('p-tipo').value;
    const data = {
      id: id || U.uid(),
      nombre, marca: U.id('p-marca').value.trim(),
      unidad: U.id('p-unidad').value, precio,
      genero: U.id('p-genero').value,
      tipoProducto: tipoCatalogo,
      esNuevo: !!U.id('p-esnuevo')?.checked,
      esMasVendido: !!U.id('p-esmasvendido')?.checked,
      concentracion: U.id('p-concentracion').value,
      precioPromocional: parseFloat(U.id('p-pprom').value) || null,
      esDecantDe: U.id('p-decant-padre')?.value || null,
      costo: parseFloat(U.id('p-costo').value) || 0,
      stock: parseInt(U.id('p-stock').value) || 0,
      stockMin: parseInt(U.id('p-smin').value) || 5,
      stockMax: parseInt(U.id('p-smax').value) || 100,
      precioMayorista: parseFloat(U.id('p-pmay').value) || precio * 0.9,
      precioContratista: parseFloat(U.id('p-pcont').value) || precio * 0.85,
      descripcion: U.id('p-desc').value.trim(),
      imagen: U.id('p-imagen')?.value || '',
      ubicacion: U.id('p-ubicacion').value.trim(),
      activo: true, creado: id ? undefined : U.now()
    };
    if (id) { const old = await DB.get('productos', id); if (old) data.creado = old.creado; }

    const btnGuardar = document.querySelector('#modal-footer .btn-primary');
    if (btnGuardar) { btnGuardar.disabled = true; btnGuardar.textContent = '⏳ Guardando...'; }

    try {
      const foto = U.id('p-imagen-file')?.files?.[0];
      if (foto) {
        data.imagen = await Views.Inventario.subirImagenProducto(data.id, foto);
      }
      await DB.put('productos', data);
      App.closeModal();
      Toast.success(`Perfume ${id ? 'actualizado' : 'creado'} correctamente`);
      await Views.Inventario.renderTable();
    } catch (error) {
      console.error('Error al guardar perfume:', error);
      if (btnGuardar) { btnGuardar.disabled = false; btnGuardar.textContent = '💾 Guardar'; }
      const detalle = error?.message || error?.details || error?.hint || 'Error desconocido';
      Toast.error(`No se pudo guardar el perfume: ${detalle}`);
    }
  },

  async doAjuste(id) {
    if (!Auth.hasPermission('inventario.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const p = await DB.get('productos', id);
    const tipo = U.id('aj-tipo').value;
    const qty = parseInt(U.id('aj-qty').value) || 0;
    const motivo = U.id('aj-motivo').value.trim();
    if (qty <= 0) { Toast.error('Cantidad inválida'); return; }

    let nuevoStock = p.stock;
    if (tipo === 'entrada') nuevoStock += qty;
    else if (tipo === 'salida') nuevoStock = Math.max(0, nuevoStock - qty);
    else nuevoStock = qty;

    p.stock = nuevoStock;
    await DB.put('productos', p);
    await DB.put('movimientos', { id: U.uid(), tipo, productoId: id, productoNombre: p.nombre, cantidad: qty, referencia: 'Ajuste manual', motivo: motivo || tipo, fecha: U.now(), usuarioId: Auth.currentUser.id });

    App.closeModal();
    Toast.success(`Stock ajustado: ${nuevoStock} ${p.unidad||'und'}`);
    await Views.Inventario.renderTable();
  },

       <button class="btn btn-primary" onclick="Views.Inventario.processImport()">📤 Importar</button>`
    );
    setTimeout(() => {
      const inp = U.id('csv-file');
      if (inp) inp.addEventListener('change', e => Views.Inventario.previewCSV(e.target.files[0]));
    }, 50);
  },

  previewCSV(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      const preview = U.id('csv-preview');
      if (!preview) return;
      preview.innerHTML = `
        <div style="font-size:.75rem;color:var(--text3);margin-bottom:6px">✅ ${Math.max(0, lines.length - 1)} productos detectados</div>
        <div style="max-height:120px;overflow-y:auto;font-size:.68rem;background:var(--bg3);border-radius:6px;padding:8px;font-family:monospace">
          ${lines.slice(0, 6).map((l, i) => `<div style="color:${i===0?'var(--accent2)':'var(--text2)'};padding:2px 0;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${U.esc(l.slice(0, 120))}</div>`).join('')}
          ${lines.length > 6 ? `<div style="color:var(--text3);padding-top:4px">… y ${lines.length - 6} filas más</div>` : ''}
        </div>`;
    };
    reader.readAsText(file, 'UTF-8');
  },

  async processImport() {
    const file = U.id('csv-file')?.files[0];
    if (!file) { Toast.error('Selecciona un archivo CSV'); return; }
    const text = await file.text();
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { Toast.error('El archivo está vacío o sin datos'); return; }

    // Parse header
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
    const idx = k => headers.indexOf(k);

    const existentes = await DB.getAll('productos');
    const skuMap = Object.fromEntries(existentes.filter(p=>p.sku).map(p=>[p.sku.toLowerCase(), p]));

    let created = 0, updated = 0, errors = 0;
    for (let i = 1; i < lines.length; i++) {
      try {
        // Handle quoted CSV fields
        const cols = [];
        let cur = '', inQ = false;
        for (const ch of lines[i] + ',') {
          if (ch === '"') { inQ = !inQ; continue; }
          if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        const get = (...keys) => { for (const k of keys) { const v = cols[idx(k)]||''; if (v) return v; } return ''; };
        const nombre = get('nombre', 'name', 'producto'); if (!nombre) continue;
        const sku = get('sku', 'codigo', 'code') || `IMP-${Date.now().toString(36).slice(-4).toUpperCase()}${i}`;
        const existing = skuMap[sku.toLowerCase()];
        const prod = existing ? { ...existing } : { id: U.uid(), activo: true, creado: U.now() };
        prod.nombre    = nombre;
        prod.sku       = sku;
        prod.barcode   = get('barcode', 'codigo_barras', 'ean') || prod.barcode || '';
        prod.categoria = get('categoria', 'category') || prod.categoria || 'General';
        prod.marca     = get('marca', 'brand') || prod.marca || '';
        prod.modelo    = get('modelo', 'model') || prod.modelo || '';
        prod.unidad    = get('unidad', 'unit') || prod.unidad || 'und';
        prod.descripcion = get('descripcion', 'description') || prod.descripcion || '';
        prod.ubicacion = get('ubicacion', 'location') || prod.ubicacion || '';
        const costo = parseFloat(get('costo', 'cost', 'precio_costo'));
        const precio = parseFloat(get('precio', 'price', 'precio_venta'));
        const stock  = parseFloat(get('stock', 'cantidad', 'qty'));
        const stMin  = parseFloat(get('stockmin', 'stock_min', 'minimo'));
        if (!isNaN(costo))  prod.costo    = costo;
        if (!isNaN(precio)) prod.precio   = precio;
        if (!isNaN(stock))  prod.stock    = stock;
        if (!isNaN(stMin))  prod.stockMin = stMin;
        prod.actualizado = U.now();
        await DB.put('productos', prod);
        existing ? updated++ : created++;
      } catch (err) { errors++; }
    }
    App.closeModal();
    Toast.success(`Importación lista · ${created} nuevos · ${updated} actualizados${errors ? ` · ${errors} con error` : ''}`);
    await Views.Inventario.render();
  },

  async exportCSV() {
    const prods = await DB.getAll('productos');
    const headers = ['SKU','Nombre','Categoría','Marca','Precio','Costo','Stock','StockMin','Unidad'];
    const rows = prods.map(p => [p.sku,p.nombre,p.categoria,p.marca,p.precio,p.costo,p.stock,p.stockMin,p.unidad]);
    U.exportExcel('inventario.xlsx', headers, rows);
    Toast.success('Excel exportado');
  }
};

          <div class="table-wrap"><table>

            <tbody>
              ${productos.map(p => `<tr>
                <td>${U.esc(p.sku||'—')}</td>

                <td style="text-align:right;font-weight:700" id="cf-dif-${p.id}">—</td>
              </tr>`).join('')}
            </tbody>
          </table></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn btn-secondary" onclick="Views.Conteo.cancelar()">Cancelar</button>
          <button class="btn btn-primary" onclick="Views.Conteo.aplicar()">✅ Aplicar Ajustes de Inventario</button>
        </div>
      </div>`;
  },

  calcDif(id, stockSistema) {
    const input = U.id(`cf-${id}`);
    const el = U.id(`cf-dif-${id}`);
    const val = input.value;
    if (val === '') { el.textContent = '—'; el.style.color = ''; return; }
    const dif = parseInt(val) - stockSistema;
    el.textContent = dif > 0 ? `+${dif}` : `${dif}`;
    el.style.color = dif === 0 ? 'var(--text3)' : dif > 0 ? 'var(--green)' : 'var(--red)';
  },

  async iniciar() {
    const cat = U.id('cf-cat').value;
    const productos = (await DB.getAll('productos')).filter(p => p.activo !== false && (!cat || p.categoria === cat));
    if (!productos.length) { Toast.error('No hay productos en ese alcance'); return; }
    Views.Conteo.session = {
      productos: productos.map(p => ({ id: p.id, nombre: p.nombre, sku: p.sku, stockSistema: p.stock }))
    };
    await Views.Conteo.render();
  },

  cancelar() {
    App.confirm('¿Cancelar el conteo? Se perderá lo que hayas ingresado.', () => {
      Views.Conteo.session = null;
      Views.Conteo.render();
    });
  },

  async aplicar() {
    if (!Auth.hasPermission('inventario.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const { productos } = Views.Conteo.session;
    const referencia = `CF-${Date.now().toString(36).toUpperCase()}`;
    let ajustados = 0, sinCambio = 0, sinContar = 0;

    for (const item of productos) {
      const val = U.id(`cf-${item.id}`)?.value;
      if (val === '' || val === undefined) { sinContar++; continue; }
      const contado = parseInt(val) || 0;
      if (contado === item.stockSistema) { sinCambio++; continue; }

      const p = await DB.get('productos', item.id);
      if (!p) continue;
      p.stock = contado;
      await DB.put('productos', p);
      await DB.put('movimientos', {
        id: U.uid(), tipo: 'ajuste', productoId: item.id, productoNombre: item.nombre,
        cantidad: contado, referencia, motivo: `Conteo físico (sistema: ${item.stockSistema} → contado: ${contado})`,
        fecha: U.now(), usuarioId: Auth.currentUser.id
      });
      ajustados++;
    }

    Views.Conteo.session = null;
    Toast.success(`Conteo aplicado: ${ajustados} ajustados, ${sinCambio} sin diferencia, ${sinContar} sin contar`);
    await Views.Conteo.render();
  }
};

  async convertirCotizacion(id) {
    if (Views.Ventas._convirtiendo) { Toast.warning('La conversión ya está en proceso.'); return; }
    const cot = await DB.get('ventas', id);
    if (!cot || cot.estado !== 'cotizacion') { Toast.info('La cotización no está disponible.'); return; }
    App.openModal('Convertir cotización', `
      <div class="form-group"><label class="form-label">Método de pago</label>
        <select class="form-control" id="cot-metodo">
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
          <option value="credito">Crédito</option>
        </select>
      </div>
      <div class="card card-sm" style="margin-top:10px"><strong>${U.esc(cot.numero)}</strong> · ${U.fmt.money(cot.total||0)}<br><span class="text-muted">La conversión es atómica: factura, stock, crédito y movimientos se procesan juntos.</span></div>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button>
       <button class="btn btn-primary" onclick="Views.Ventas.confirmarConversionCotizacion('${id}')">Confirmar venta</button>`
    );
  },

  async confirmarConversionCotizacion(id) {
    if (Views.Ventas._convirtiendo) { Toast.warning('La conversión ya está en proceso.'); return; }
    const cot = await DB.get('ventas', id);
    if (!cot || cot.estado !== 'cotizacion') { Toast.info('La cotización no está disponible.'); return; }
    const method = U.id('cot-metodo')?.value || 'efectivo';
    if (!['efectivo','transferencia','credito'].includes(method)) { Toast.error('Método de pago no válido'); return; }
    if (method === 'credito' && !cot.clienteId) { Toast.error('La venta a crédito requiere cliente'); return; }
    Views.Ventas._convirtiendo = true;
    try {
      const { data, error } = await DB.client.rpc('convertir_cotizacion_segura', {
        p_cotizacion_id: id,
        p_metodo: method
      });
      if (error) throw error;
      const result = typeof data === 'string' ? JSON.parse(data) : data;
      if (!result?.ok) throw new Error(result?.message || 'Conversión rechazada por Supabase.');
      App.closeModal();
      Toast.success(result.message || `Cotización convertida en ${result.numero || 'factura'}`);
      await Views.Ventas.render();
    } catch (e) {
      console.error('[convertir_cotizacion_segura]', e);
      Toast.error(`No se pudo convertir la cotización: ${e.message || 'error del servidor'}`);
    } finally {
      Views.Ventas._convirtiendo = false;
    }
  },

  async anularVenta(id) {
    if (Views.Ventas._anulando) { Toast.warning('Ya hay una anulación en proceso.'); return; }
    if (!Auth.hasPermission('ventas.anular')) { Toast.error('No tienes permiso para esta acción'); return; }
    const v = await DB.get('ventas', id);
    if (!v) return;
    if (v.estado === 'anulada') { Toast.info('El documento ya está anulado'); return; }
    if (!['completada','credito','pagado_parcial','cotizacion','vendido'].includes(v.estado)) {
      Toast.info('Este documento no se puede anular.'); return;
    }
    const esCot = v.estado === 'cotizacion';
    App.confirm(esCot
      ? `¿Anular la cotización ${v.numero}? No se modificará inventario ni caja.`
      : `¿Anular ${v.numero}? Se revertirán inventario, caja/transferencia, crédito, puntos y movimientos relacionados.`,
      async () => {
        Views.Ventas._anulando = true;
        try {
          const { data, error } = await DB.client.rpc('anular_venta_segura', { p_venta_id: id });
          if (error) throw error;
          const result = typeof data === 'string' ? JSON.parse(data) : data;
          if (!result?.ok) throw new Error(result?.message || 'Anulación rechazada por Supabase.');
          Toast.success(result.message || `${v.numero} anulada correctamente`);
          await Views.Ventas.render();
        } catch (e) {
          console.error('[anular_venta_segura]', e);
          Toast.error(`No se pudo anular: ${e.message || 'error del servidor'}`);
        } finally {
          Views.Ventas._anulando = false;
        }
      }
    );
  },

  async saveCompra() {
    if (!Auth.hasPermission('compras.crear')) { Toast.error('No tienes permiso para esta acción'); return; }
    const provId = U.id('cp-prov')?.value;
    const items = window._cpItems || [];
    if (!provId) { Toast.error('Selecciona un proveedor'); return; }
    if (!items.length) { Toast.error('Agrega al menos un producto'); return; }

    const proveedores = await DB.getAll('proveedores');
    const prov = proveedores.find(p => p.id === provId);
    const compras = await DB.getAll('compras');
    const cfgOC = await DB.get('configuracion','config') || {};
    const ocPrefix = cfgOC.ocPrefix || 'OC';
    const ocNum = `${ocPrefix}-${String(compras.filter(c=>c.numero?.startsWith(ocPrefix)).length+1).padStart(4,'0')}`;
    const total = items.reduce((s,i) => s + i.qty * i.costo, 0);

    await DB.put('compras', {
      id: U.uid(), numero: ocNum,
      proveedorId: provId, proveedorNombre: prov?.nombre || '—',
      items, total, estado: 'pendiente',
      metodoPago: '—', totalPagado: 0, saldoPago: total, estadoPago: 'pendiente', pagos: [],
      fecha: U.id('cp-fecha')?.value || U.now().split('T')[0],
      notas: U.id('cp-notas')?.value || '',
      creadoPor: Auth.currentUser.id, creado: U.now()

    Toast.success('Orden de compra creada');
    await Views.Compras.render();

      `${c.estado==='recibida_total' && Number(c.saldoPago ?? c.total) > 0 && Auth.hasPermission('compras.pagar') ? `<button class="btn btn-primary" onclick="App.closeModal();Views.Compras.modalPago('${id}')">💳 Registrar pago</button>` : ''}<button class="btn btn-secondary" onclick="App.closeModal()">Cerrar</button>`
    );
  },

  async modalPago(id) {
    if (!Auth.hasPermission('compras.pagar')) { Toast.error('No tienes permiso para pagar compras'); return; }
    const c = await DB.get('compras', id);
    if (!c || c.estado !== 'recibida_total') { Toast.error('La compra debe estar recibida completamente antes de pagar'); return; }
    const total = Number(c.total || 0), pagado = Number(c.totalPagado || 0);
    const saldo = Math.max(0, Number(c.saldoPago ?? (total - pagado)));
    if (saldo <= 0) { Toast.info('Esta compra ya está pagada'); return; }
    App.openModal(`Registrar pago · ${c.numero}`, `
      <div class="card card-sm" style="margin-bottom:14px;background:var(--bg3)">
        <div class="flex justify-between text-sm"><span>Proveedor</span><strong>${U.esc(c.proveedorNombre||'—')}</strong></div>
        <div class="flex justify-between text-sm" style="margin-top:6px"><span>Total compra</span><strong>${U.fmt.money(total)}</strong></div>
        <div class="flex justify-between text-sm" style="margin-top:6px"><span>Pagado</span><span>${U.fmt.money(pagado)}</span></div>
        <div class="flex justify-between" style="margin-top:8px;font-weight:800;font-size:1rem"><span>Saldo</span><span style="color:var(--yellow)">${U.fmt.money(saldo)}</span></div>
      </div>
      <div class="form-group"><label class="form-label">Monto a pagar (RD$)</label><input class="form-control" id="cp-pago-monto" type="number" min="0.01" max="${saldo.toFixed(2)}" step="0.01" value="${saldo.toFixed(2)}"/></div>
      <div class="form-group"><label class="form-label">Método de pago</label><select class="form-control" id="cp-pago-metodo"><option value="efectivo">💵 Efectivo</option><option value="transferencia">🏦 Transferencia</option><option value="cheque">🧾 Cheque</option></select></div>
      <div class="form-group"><label class="form-label">Nota (opcional)</label><input class="form-control" id="cp-pago-nota" placeholder="Referencia o nota del pago"/></div>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button><button class="btn btn-primary" onclick="Views.Compras.registrarPago('${id}')">💳 Registrar pago</button>`
    );
  },

  async registrarPago(id) {
    if (!Auth.hasPermission('compras.pagar')) { Toast.error('No tienes permiso para pagar compras'); return; }
    const c = await DB.get('compras', id);
    if (!c || c.estado !== 'recibida_total') { Toast.error('La compra no está disponible para pago'); return; }
    const total = Number(c.total || 0), pagado = Number(c.totalPagado || 0);
    const saldo = Math.max(0, Number(c.saldoPago ?? (total - pagado)));
    const monto = Number(parseFloat(U.id('cp-pago-monto')?.value || 0).toFixed(2));
    const metodoPago = U.id('cp-pago-metodo')?.value || 'efectivo';
    const nota = U.id('cp-pago-nota')?.value?.trim() || '';
    if (!Number.isFinite(monto) || monto <= 0 || monto > saldo + 0.005) { Toast.error(`Monto inválido. Saldo pendiente: ${U.fmt.money(saldo)}`); return; }
    const referencia = `PAG-PROV-${c.numero}-${Date.now().toString(36).toUpperCase()}`;
    const pagos = Array.isArray(c.pagos) ? c.pagos.slice() : [];
    pagos.push({ id: U.uid(), monto, metodoPago, referencia, nota, fecha: U.now(), usuarioId: Auth.currentUser.id });
    const nuevoPagado = Number((pagado + monto).toFixed(2));
    const nuevoSaldo = Number(Math.max(0, total - nuevoPagado).toFixed(2));
    c.totalPagado = nuevoPagado; c.saldoPago = nuevoSaldo; c.estadoPago = nuevoSaldo <= 0 ? 'pagada' : 'pagada_parcial';
    c.metodoPago = metodoPago; c.pagos = pagos; c.fechaPago = U.now();
    await DB.put('compras', c);
    await DB.put('movimientos', { id: U.uid(), tipo: 'pago_proveedor', productoId: '', productoNombre: `Pago proveedor: ${c.proveedorNombre||'—'}`, proveedorNombre: c.proveedorNombre||'—', cantidad: 1, monto: -monto, metodoPago, referencia, facturaId: c.id, motivo: `Pago ${c.numero} — ${c.proveedorNombre||'—'}${nota ? ` — ${nota}` : ''}`, descripcion: `Salida de caja por compra ${c.numero}`, fecha: U.now(), usuarioId: Auth.currentUser.id });
    App.closeModal(); Toast.success(`${c.numero}: pago de ${U.fmt.money(monto)} registrado · Saldo: ${U.fmt.money(nuevoSaldo)}`); await Views.Compras.render();
  },

  async anularCompra(id) {
    if (!Auth.hasPermission('compras.eliminar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const c = await DB.get('compras', id);
    if (!c) return;
    App.confirm(`¿Anular la orden de compra ${c.numero}?`, async () => {
      c.estado = 'anulada';
      await DB.put('compras', c);
      Toast.info(`${c.numero} anulada`);
      await Views.Compras.render();
    });
  },

  async exportCSV() {
    const compras = (await DB.getAll('compras')).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    const headers = ['N° Orden','Proveedor','Fecha','Items','Total','Estado'];
    const rows = compras.map(c=>[c.numero,c.proveedorNombre||'—',c.fecha,(c.items||[]).length,c.total,c.estado]);
    U.exportExcel('compras.xlsx', headers, rows);
    Toast.success('Excel exportado');
  },

  async modalRecibir(id) {
    const c = await DB.get('compras', id);
    if (!c) return;
    const rows = (c.items||[]).map((it, i) => {
      const recibido = it.recibido || 0;
      const pendiente = it.qty - recibido;
      if (pendiente <= 0) return '';
      return `<tr>
        <td>${U.esc(it.nombre)}</td>
        <td style="text-align:right">${it.qty}</td>
        <td style="text-align:right">${recibido}</td>
        <td style="text-align:right;color:var(--orange);font-weight:700">${pendiente}</td>
        <td style="text-align:right"><input class="form-control" style="width:80px;text-align:right" type="number" min="0" max="${pendiente}" value="${pendiente}" id="rec-${i}"/></td>
      </tr>`;
    }).join('');

    App.openModal(`Recibir orden ${c.numero}`, `
      <div class="alert alert-info" style="margin-bottom:12px"><span>ℹ️</span><div>Puedes recibir menos de lo pedido — lo que falte queda registrado como <strong>backorder</strong> (pendiente de surtir por el proveedor).</div></div>
      <table style="width:100%;font-size:.8rem">
        <thead><tr><th style="text-align:left">Producto</th><th style="text-align:right">Pedido</th><th style="text-align:right">Ya recibido</th><th style="text-align:right">Pendiente</th><th style="text-align:right">Recibir ahora</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`,
      `<button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button>
       <button class="btn btn-primary" onclick="Views.Compras.confirmarRecepcion('${id}')">✅ Confirmar recepción</button>`
    );
  },

  async confirmarRecepcion(id) {
    if (!Auth.hasPermission('compras.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const c = await DB.get('compras', id);
    if (!c) return;

    let algoRecibido = false;
    let idx = 0;
    for (const item of c.items) {
      const recibidoPrevio = item.recibido || 0;
      const pendiente = item.qty - recibidoPrevio;
      if (pendiente <= 0) { idx++; continue; }
      const input = U.id(`rec-${idx}`);
      const cantidadAhora = U.clamp(parseInt(input?.value) || 0, 0, pendiente);
      idx++;
      if (cantidadAhora <= 0) continue;

      const p = await DB.get('productos', item.productoId);
      if (p) {
        p.stock += cantidadAhora;
        p.costo = item.costo;
        await DB.put('productos', p);
        await DB.put('movimientos', { id: U.uid(), tipo: 'entrada', productoId: p.id, productoNombre: p.nombre, cantidad: cantidadAhora, costo: item.costo, referencia: c.numero, motivo: 'Compra', fecha: U.now(), usuarioId: Auth.currentUser.id });
      }
      item.recibido = recibidoPrevio + cantidadAhora;
      algoRecibido = true;
    }

    if (!algoRecibido) { Toast.error('Ingresa al menos una cantidad a recibir'); return; }

    const todoCompleto = c.items.every(it => (it.recibido||0) >= it.qty);
    c.estado = todoCompleto ? 'recibida_total' : 'recibida_parcial';
    c.fechaRecepcion = U.now();
    await DB.put('compras', c);

    App.closeModal();
    Toast.success(todoCompleto ? `${c.numero} recibida completa. Stock actualizado.` : `${c.numero} recibida parcialmente — queda un backorder pendiente.`);
    await Views.Compras.render();
  },

  async cerrarBackorder(id) {
    if (!Auth.hasPermission('compras.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const c = await DB.get('compras', id);
    if (!c) return;
    App.confirm(`¿Cerrar el backorder de ${c.numero}? Lo que falte por recibir se dará por cancelado (no se sumará al inventario).`, async () => {
      c.estado = 'recibida_total';
      await DB.put('compras', c);
      Toast.success(`Backorder de ${c.numero} cerrado`);
      await Views.Compras.render();
    });
  }
};

    const facturasAplicadas = [];
    const ventasCliente = (await DB.getAll('ventas'))
      .filter(v => v.clienteId === id && v.metodoPago === 'credito' && ['credito','pagado_parcial'].includes(v.estado))
      .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
    for (const v of ventasCliente) {
      if (restante <= 0) break;
      const totalFactura = Number(v.total || 0);
      const yaPagado = Number(v.pagadoParcial ?? v.pagado ?? 0);
      const saldo = Math.max(0, totalFactura - yaPagado);
      if (saldo <= 0) continue;
      const aplicar = Math.min(restante, saldo);
      v.pagadoParcial = yaPagado + aplicar;
      v.pagado = v.pagadoParcial;
      v.estado = v.pagadoParcial >= totalFactura - 0.01 ? 'completada' : 'pagado_parcial';
      v.ultimoPago = U.now();
      v.metodoUltimoPago = metodoPago;
      await DB.put('ventas', v);
      facturasAplicadas.push({ id: v.id, numero: v.numero || 'Factura', monto: aplicar });
      restante -= aplicar;
    }
    if (restante > 0.01) { Toast.error('No se pudo aplicar todo el cobro a facturas pendientes.'); return; }
    c.deuda = Math.max(0, c.deuda - monto);
    await DB.put('clientes', c);
    const facturaPrincipal = facturasAplicadas[0] || {};
    const referenciaCobro = `COB-${facturaPrincipal.numero || facturaPrincipal.id || Date.now().toString(36).toUpperCase()}`;
    await DB.put('movimientos', {
      id: U.uid(), tipo: 'cobro_credito', productoId: '',
      productoNombre: `Cobro crédito: ${c.nombre}`, cantidad: 1, monto, metodoPago,
      referencia: referenciaCobro, facturaId: facturaPrincipal.id || '',
      facturaNumero: facturaPrincipal.numero || '', facturasAplicadas,
      motivo: `Cobro de factura${facturasAplicadas.length > 1 ? 's' : ''} a crédito — ${facturasAplicadas.map(f => `${f.numero}: ${U.fmt.money(f.monto)}`).join(', ')}`,
      descripcion: `Cobro de crédito aplicado a ${facturasAplicadas.map(f => f.numero).join(', ')}`,
      fecha: U.now(), usuarioId: Auth.currentUser.id
    });
    App.closeModal();
    Toast.success(`Cobro registrado: ${U.fmt.money(monto)} · Deuda restante: ${U.fmt.money(c.deuda)}`);
    await Views.Clientes.render();
  },

  async eliminar(id) {
    if (!Auth.hasPermission('clientes.eliminar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const c = await DB.get('clientes', id);
    App.confirm(`¿Eliminar a "${U.esc(c?.nombre)}"?`, async () => { await DB.delete('clientes', id); Toast.success('Cliente eliminado'); await Views.Clientes.render(); });
  }
};

Views.Caja = {
  selectedDate: new Date().toISOString().split('T')[0],

  async render() {
    document.getElementById('topbar-title').textContent = 'Caja Central';
    U.id('topbar-actions').innerHTML = `
      ${Auth.hasPermission('caja.arqueo') ? `<button class="btn btn-secondary btn-sm" onclick="Views.Caja.arqueo()">📋 Arqueo de Caja</button>` : ''}

    await Views.Caja.renderContent(Views.Caja.selectedDate);
  },

  async renderContent(fecha) {
    Views.Caja.selectedDate = fecha;
    const ventas = await DB.getAll('ventas');
    const movimientos = await DB.getAll('movimientos');
    const selDate = new Date(fecha + 'T00:00:00').toDateString();
    const hoy = ventas.filter(v => V.esVentaActiva(v) && new Date(v.fecha).toDateString() === selDate);
    // Cobros de deuda a crédito: son entrada de caja aunque no sean una "venta"
    const cobrosHoy = movimientos.filter(m => m.tipo === 'cobro_credito' && new Date(m.fecha).toDateString() === selDate);
    const cobrosPorMetodo = (m) => cobrosHoy.filter(c => (c.metodoPago||'efectivo') === m).reduce((s,c) => s + (c.monto||0), 0);
    const totalCobros = cobrosHoy.reduce((s,c) => s + (c.monto||0), 0);
    const pagosProveedoresHoy = movimientos.filter(m => m.tipo === 'pago_proveedor' && new Date(m.fecha).toDateString() === selDate);
    const comprasCaja = await DB.getAll('compras');
    const comprasPorId = Object.fromEntries(comprasCaja.map(c => [c.id, c]));
    const pagosProveedoresPorMetodo = (m) => pagosProveedoresHoy.filter(p => (p.metodoPago||'efectivo') === m).reduce((s,p) => s + Math.abs(Number(p.monto||0)), 0);
    const totalPagosProveedores = pagosProveedoresHoy.reduce((s,p) => s + Math.abs(Number(p.monto||0)), 0);

    const ventasPorId = Object.fromEntries(ventas.map(v => [v.id, v]));
    const ajustesCaja = movimientos.filter(m => ['devolucion','anulacion'].includes(m.tipo) && Number(m.monto||0) < 0 && new Date(m.fecha).toDateString() === selDate && (() => {
      const original = ventasPorId[m.facturaId];
      // Una anulación siempre implica salida de dinero. Una devolución parcial del mismo día
      // ya está reflejada en el total neto de la factura y no debe descontarse dos veces.
      if (m.tipo === 'anulacion') return true;
      return !original || new Date(original.fecha).toDateString() !== selDate;
    })());
    const reembolsosEfectivo = ajustesCaja.filter(m => (m.metodoPago||'efectivo') === 'efectivo').reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const reembolsosTransfer = ajustesCaja.filter(m => m.metodoPago === 'transferencia').reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const efectivo = hoy.filter(v=>v.metodoPago==='efectivo'&&v.total>0).reduce((s,v)=>s+v.total,0) + cobrosPorMetodo('efectivo') - reembolsosEfectivo - pagosProveedoresPorMetodo('efectivo');
    const transfer = hoy.filter(v=>v.metodoPago==='transferencia'&&v.total>0).reduce((s,v)=>s+v.total,0) + cobrosPorMetodo('transferencia') - reembolsosTransfer - pagosProveedoresPorMetodo('transferencia');
    const credito  = hoy.filter(v=>v.metodoPago==='credito').reduce((s,v)=>s+v.total,0);
    const devoluciones = ajustesCaja.reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    // TOTAL BRUTO = ventas del día únicamente. Los cobros de crédito NO son ventas nuevas.
    const totalHoy = hoy.filter(v=>v.total>0).reduce((s,v)=>s+v.total,0);
    // NETO DEL DÍA = entradas reales de caja (ventas cobradas + cobros de crédito)
    // menos devoluciones y pagos a proveedores. Una factura a crédito no entra aquí
    // hasta que efectivamente se cobre.
    const totalVentasCobradas = hoy.filter(v=>v.total>0 && v.metodoPago!=='credito').reduce((s,v)=>s+v.total,0);
    const neto = totalVentasCobradas + totalCobros - devoluciones - totalPagosProveedores;

    // Last 7 days selector
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push(d.toISOString().split('T')[0]);
    }

    U.id('view-area').innerHTML = `
      <div class="filter-bar">
        <label class="form-label" style="margin:0;white-space:nowrap">Fecha:</label>
        <input type="date" class="form-control" id="caja-fecha" value="${fecha}" max="${new Date().toISOString().split('T')[0]}" onchange="Views.Caja.renderContent(this.value)" style="width:auto"/>

          ${days.map(d=>`<button class="btn btn-${d===fecha?'primary':'ghost'} btn-sm" onclick="Views.Caja.renderContent('${d}')">${d===new Date().toISOString().split('T')[0]?'Hoy':new Date(d+'T12:00:00').toLocaleDateString('es-DO',{weekday:'short',day:'numeric'})}</button>`).join('')}
        </div>
      </div>
      <div class="page-content">
        <div class="stats-grid stats-grid-3" style="margin-bottom:14px">
          <div class="stat-card green"><span class="stat-icon">💵</span><div class="stat-label">Efectivo</div><div class="stat-value">${U.fmt.money(efectivo)}</div><div class="stat-sub">${hoy.filter(v=>v.metodoPago==='efectivo'&&v.total>0).length} ventas</div></div>
          <div class="stat-card purple"><span class="stat-icon">🏦</span><div class="stat-label">Transferencia</div><div class="stat-value">${U.fmt.money(transfer)}</div></div>
          <div class="stat-card yellow"><span class="stat-icon">📋</span><div class="stat-label">Crédito</div><div class="stat-value">${U.fmt.money(credito)}</div></div>
        </div>

        <div class="stats-grid stats-grid-3" style="margin-bottom:14px">
          <div class="card" style="border-top:2px solid var(--green)">
            <div class="stat-label">TOTAL BRUTO</div>
            <div style="font-size:1.8rem;font-weight:900;color:var(--green)">${U.fmt.money(totalHoy)}</div>
            <div class="stat-sub">${hoy.filter(v=>v.total>0).length} transacciones</div>
          </div>
          <div class="card" style="border-top:2px solid var(--red)">
            <div class="stat-label">DEVOLUCIONES</div>
            <div style="font-size:1.8rem;font-weight:900;color:var(--red)">−${U.fmt.money(devoluciones)}</div>
            <div class="stat-sub">${hoy.filter(v=>v.total<0).length} devoluciones</div>
          </div>
          <div class="card" style="border-top:2px solid var(--accent)">
            <div class="stat-label">NETO DEL DÍA</div>
            <div style="font-size:1.8rem;font-weight:900;color:var(--accent2)">${U.fmt.money(neto)}</div>
            <div class="stat-sub">después de devoluciones y pagos a proveedores</div>
          </div>

        <div class="card card-sm" style="margin-bottom:14px"><div class="flex justify-between" style="font-size:.78rem"><span>💳 Pagos a proveedores del día</span><strong style="color:var(--red)">−${U.fmt.money(totalPagosProveedores)}</strong></div></div>

        <div class="card" style="padding:0;overflow:hidden">
          <div class="card-sm flex justify-between" style="border-bottom:1px solid var(--border)">
            <span style="font-weight:700">Movimientos del día · ${new Date(fecha+'T12:00:00').toLocaleDateString('es-DO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
            <span class="badge badge-blue">${hoy.length + cobrosHoy.length + pagosProveedoresHoy.length + ajustesCaja.length} registros</span>
          </div>
          <div class="table-wrap"><table>

            <tbody>
              ${(() => {
                const filas = [
                  ...hoy.map(v => ({fecha:v.fecha, numero:v.numero, tercero:v.clienteNombre||'General', metodo:v.metodoPago||'—', total:Number(v.total||0), estado:v.estado, tipo:'venta'})),
                  ...cobrosHoy.map(m => ({fecha:m.fecha, numero:m.referencia || (m.facturaNumero ? `COB-${m.facturaNumero}` : '—'), tercero:(m.productoNombre||'').replace('Cobro crédito: ','')||'Cliente', metodo:m.metodoPago||'efectivo', total:Math.abs(Number(m.monto||0)), estado:'Cobro de factura a crédito', tipo:'cobro'})),
                  ...pagosProveedoresHoy.map(m => ({fecha:m.fecha, numero:m.referencia||'—', tercero:m.proveedorNombre || comprasPorId[m.facturaId]?.proveedorNombre || 'Proveedor', metodo:m.metodoPago||'efectivo', total:-Math.abs(Number(m.monto||0)), estado:'Pagado', tipo:'pago_proveedor'})),
                  ...ajustesCaja.map(m => ({fecha:m.fecha, numero:m.referencia||m.facturaId||'—', tercero:'Cliente', metodo:m.metodoPago||'efectivo', total:-Math.abs(Number(m.monto||0)), estado:m.tipo==='anulacion'?'Anulación':'Devolución', tipo:m.tipo}))
                ].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
                return filas.length ? filas.map(v=>`

    const ventas = await DB.getAll('ventas');
    const movimientos = await DB.getAll('movimientos');
    const fecha = Views.Caja.selectedDate;
    const selDate = new Date(fecha + 'T00:00:00').toDateString();
    const hoy = ventas.filter(v => V.esVentaActiva(v) && new Date(v.fecha).toDateString() === selDate);
    const cobrosEfectivo = movimientos.filter(m => m.tipo === 'cobro_credito' && (m.metodoPago||'efectivo') === 'efectivo' && new Date(m.fecha).toDateString() === selDate).reduce((s,c)=>s+(c.monto||0),0);
    const ventasPorId = Object.fromEntries(ventas.map(v => [v.id, v]));
    const reembolsosEfectivo = movimientos.filter(m => ['devolucion','anulacion'].includes(m.tipo) && Number(m.monto||0)<0 && (m.metodoPago||'efectivo')==='efectivo' && new Date(m.fecha).toDateString()===selDate && (()=>{ const original=ventasPorId[m.facturaId]; return !original || new Date(original.fecha).toDateString()!==selDate; })()).reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const pagosProvEfectivo = movimientos.filter(m => m.tipo === 'pago_proveedor' && (m.metodoPago||'efectivo') === 'efectivo' && new Date(m.fecha).toDateString() === selDate).reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const efectivoSistema = hoy.filter(v=>v.metodoPago==='efectivo'&&v.total>0).reduce((s,v)=>s+v.total,0) + cobrosEfectivo - reembolsosEfectivo - pagosProvEfectivo;
    const fondo = parseFloat(U.id('arq-fondo')?.value||0);
    const esperado = fondo + efectivoSistema;
    const contado = parseFloat(U.id('arq-contado')?.value||0) || 0;
    const dif = contado - esperado;
    const res = U.id('arq-result');
    if (res) res.innerHTML = `
      <div class="card card-sm" style="background:var(--bg3)">
        <div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px solid var(--border)"><span>Fondo apertura</span><span>${U.fmt.money(fondo)}</span></div>
        <div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px solid var(--border)"><span>Efectivo en sistema (ventas + cobros de crédito)</span><span style="color:var(--green)">${U.fmt.money(efectivoSistema)}</span></div>
        <div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px solid var(--border)"><span>Total esperado en caja</span><span style="font-weight:700">${U.fmt.money(esperado)}</span></div>
        ${contado>0?`<div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px solid var(--border)"><span>Efectivo contado</span><span>${U.fmt.money(contado)}</span></div>
        <div class="flex justify-between" style="padding:6px 0;font-weight:800;font-size:.9rem"><span>Diferencia</span><span style="color:${dif===0?'var(--green)':dif>0?'var(--blue)':'var(--red)'}">${dif>=0?'+':''}${U.fmt.money(dif)}</span></div>
        <div style="font-size:.7rem;color:var(--text3);margin-top:4px">${dif===0?'✅ Caja cuadrada':dif>0?'ℹ️ Sobrante en caja':'❌ Faltante en caja'}</div>`:''}
      </div>`;
  },

  async saveArqueo() {
    if (!Auth.hasPermission('caja.arqueo')) { Toast.error('No tienes permiso para esta acción'); return; }
    const fondo = parseFloat(U.id('arq-fondo')?.value||0);
    const contado = parseFloat(U.id('arq-contado')?.value||0);
    const obs = U.id('arq-obs')?.value||'';
    const ventas = await DB.getAll('ventas');
    const movimientos = await DB.getAll('movimientos');
    const fecha = Views.Caja.selectedDate;
    const selDate = new Date(fecha + 'T00:00:00').toDateString();
    const hoy = ventas.filter(v => V.esVentaActiva(v) && new Date(v.fecha).toDateString() === selDate);
    const cobrosEfectivo = movimientos.filter(m => m.tipo === 'cobro_credito' && (m.metodoPago||'efectivo') === 'efectivo' && new Date(m.fecha).toDateString() === selDate).reduce((s,c)=>s+(c.monto||0),0);
    const ventasPorId = Object.fromEntries(ventas.map(v => [v.id, v]));
    const reembolsosEfectivo = movimientos.filter(m => ['devolucion','anulacion'].includes(m.tipo) && Number(m.monto||0)<0 && (m.metodoPago||'efectivo')==='efectivo' && new Date(m.fecha).toDateString()===selDate && (()=>{ const original=ventasPorId[m.facturaId]; return !original || new Date(original.fecha).toDateString()!==selDate; })()).reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const pagosProvEfectivo = movimientos.filter(m => m.tipo === 'pago_proveedor' && (m.metodoPago||'efectivo') === 'efectivo' && new Date(m.fecha).toDateString() === selDate).reduce((s,m)=>s+Math.abs(Number(m.monto||0)),0);
    const efectivoSistema = hoy.filter(v=>v.metodoPago==='efectivo'&&v.total>0).reduce((s,v)=>s+v.total,0) + cobrosEfectivo - reembolsosEfectivo - pagosProvEfectivo;
    await DB.put('cajas', {
      id: U.uid(), fecha, fondo, efectivoSistema, contado,
      diferencia: contado - (fondo + efectivoSistema),
      observaciones: obs, usuarioId: Auth.currentUser.id, creado: U.now()
    });
    App.closeModal();
    Toast.success('Arqueo de caja guardado');
  },

  async exportCSV() {
    const ventas = (await DB.getAll('ventas')).filter(v=>V.esVentaActiva(v)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    const headers = ['Hora','N° Documento','Cliente','Método','Total','Estado','Fecha'];
    const movimientos = await DB.getAll('movimientos');
    const pagosProv = movimientos.filter(m=>m.tipo==='pago_proveedor').map(m=>[
      new Date(m.fecha).toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'}), m.referencia||'—', m.proveedorNombre || comprasPorId[m.facturaId]?.proveedorNombre || m.productoNombre || 'Proveedor', m.metodoPago||'efectivo', Number(m.monto||0), 'Pago proveedor', new Date(m.fecha).toLocaleDateString('es-DO')
    ]);
    const rows = ventas.map(v=>[
      new Date(v.fecha).toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'}),
      v.numero, v.clienteNombre||'General', v.metodoPago, v.total, v.estado,
      new Date(v.fecha).toLocaleDateString('es-DO')
    ]).concat(pagosProv);
    U.exportExcel('caja.xlsx', headers, rows);
    Toast.success('Excel exportado');
  }
};

  autoFillCliente(sel) {
    const opt = sel.options[sel.selectedIndex];

    U.id('dl-nombre').value = opt.dataset.nom || '';

    U.id('dl-wa').value = opt.dataset.tel || '';
  },

  addItemFromSelect(sel) {
    const opt = sel.options[sel.selectedIndex];
    if (!opt || !opt.value) return;
    const id = opt.value;
    const existing = Views.Delivery.cartItems.find(i => i.id === id);
    if (existing) existing.qty++;
    else Views.Delivery.cartItems.push({ id, nombre: opt.dataset.nombre, precio: parseFloat(opt.dataset.precio), qty: 1 });
    sel.value = '';
    Views.Delivery.renderItemsList();
  },

  renderItemsList() {
    const el = U.id('dl-items-list');
    if (!el) return;
    el.innerHTML = Views.Delivery.cartItems.map((it, idx) => `
      <div style="display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px">
        <span style="flex:1;font-size:.78rem">${U.esc(it.nombre)}</span>
        <button class="qty-btn" onclick="Views.Delivery.changeQty(${idx},-1)">−</button>
        <span style="font-size:.78rem;min-width:18px;text-align:center">${it.qty}</span>
        <button class="qty-btn" onclick="Views.Delivery.changeQty(${idx},1)">+</button>
        <span style="font-size:.78rem;font-weight:700;min-width:70px;text-align:right">${U.fmt.money(it.precio*it.qty)}</span>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="Views.Delivery.removeItem(${idx})">✕</button>
      </div>`).join('');
    Views.Delivery.recalcularTotal();
  },

  changeQty(idx, delta) {
    const it = Views.Delivery.cartItems[idx];
    if (!it) return;
    it.qty = Math.max(1, it.qty + delta);
    Views.Delivery.renderItemsList();
  },

  removeItem(idx) {
    Views.Delivery.cartItems.splice(idx, 1);
    Views.Delivery.renderItemsList();
  },

  recalcularTotal() {
    const subtotal = Views.Delivery.cartItems.reduce((s,it) => s + it.precio*it.qty, 0);
    const descuento = parseFloat(U.id('dl-desc')?.value) || 0;
    const costoDelivery = parseFloat(U.id('dl-costo')?.value) || 0;
    const total = Math.max(0, subtotal - descuento) + costoDelivery;
    const disp = U.id('dl-total-display');
    if (disp) disp.textContent = U.fmt.money(total);
    return { subtotal, descuento, costoDelivery, total };
  },

  async savePedido() {
    if (!Auth.hasPermission('ventas.crear')) { Toast.error('No tienes permiso para esta acción'); return; }
    const nombre = U.id('dl-nombre')?.value.trim();
    const direccion = U.id('dl-dir')?.value.trim();
    if (!nombre) { Toast.error('El nombre del cliente es obligatorio'); return; }
    if (!direccion) { Toast.error('La dirección es obligatoria'); return; }
    if (!Views.Delivery.cartItems.length) { Toast.error('Agrega al menos un producto'); return; }

    const clienteSel = U.id('dl-cliente');
    const { subtotal, descuento, costoDelivery, total } = Views.Delivery.recalcularTotal();

    await DB.put('delivery', {
      id: U.uid(),
      clienteId: clienteSel?.value || null,
      clienteNombre: nombre,
      telefono: U.id('dl-tel')?.value.trim() || '',
      direccion, sector: U.id('dl-sector')?.value.trim() || '',
      referencia: U.id('dl-ref')?.value.trim() || '',
      items: Views.Delivery.cartItems.map(it => ({ id: it.id, nombre: it.nombre, precio: it.precio, qty: it.qty })),
      subtotal, descuento, costoDelivery, total,
      metodoPago: U.id('dl-metodo')?.value || 'efectivo',
      estado: 'pendiente',
      fecha: U.now(), usuarioId: Auth.currentUser.id
    });

    App.closeModal();
    Toast.success('Pedido de delivery creado');
    document.getElementById('topbar-title').textContent = 'Delivery';
    await Views.Delivery.renderList();
  }
};

  toggleAlcanceInputs(tipo) {
    U.id('promo-alcance-categoria-wrap').style.display = tipo === 'categoria' ? 'block' : 'none';
    U.id('promo-alcance-genero-wrap').style.display = tipo === 'genero' ? 'block' : 'none';
    U.id('promo-alcance-producto-wrap').style.display = tipo === 'producto' ? 'block' : 'none';
  },

  async syncPromotionPrices() {
    const hoy = new Date();
    const [productos, promos] = await Promise.all([DB.getAll('productos'), DB.getAll('movimientos')]);
    const activas = promos.filter(m => m.tipo === 'promocion' && (!m.hasta || new Date(m.hasta) >= hoy));
    for (const prod of productos) {
      const aplicables = activas.filter(promo => {
        if (promo.alcanceTipo === 'producto') return prod.id === promo.alcanceProductoId;
        if (promo.alcanceTipo === 'categoria') return prod.categoria === promo.alcanceCategoria;
        if (promo.alcanceTipo === 'genero') return prod.genero === promo.alcanceGenero;
        return true;
      });
      const promo = aplicables.reduce((best, cur) => (Number(cur.descuento||0) > Number(best?.descuento||0) ? cur : best), null);
      const nuevoPrecio = promo ? +(Number(prod.precio||0) * (1 - Number(promo.descuento||0) / 100)).toFixed(2) : null;
      if (prod.precioPromocional !== nuevoPrecio || prod.promocionId !== (promo?.id || null)) {
        prod.precioPromocional = nuevoPrecio;
        prod.promocionId = promo?.id || null;
        await DB.put('productos', prod);
      }
    }
  },

  async savePromocion(id) {
    if (!Auth.hasPermission('inventario.editar')) { Toast.error('No tienes permiso para esta acción'); return; }
    const descripcion = U.id('promo-desc').value.trim();
    const descuento = parseInt(U.id('promo-pct').value) || 0;
    if (!descripcion) { Toast.error('Descripción obligatoria'); return; }
    if (descuento <= 0 || descuento > 90) { Toast.error('Descuento inválido'); return; }
    const alcanceTipo = U.id('promo-alcance-tipo').value;
    if (alcanceTipo === 'categoria' && !U.id('promo-alcance-categoria').value) { Toast.error('Selecciona una categoría'); return; }
    if (alcanceTipo === 'genero' && !U.id('promo-alcance-genero').value) { Toast.error('Selecciona un género'); return; }
    if (alcanceTipo === 'producto' && !U.id('promo-alcance-producto').value) { Toast.error('Selecciona un perfume'); return; }
    const hastaVal = U.id('promo-hasta').value;
    const data = {
      id: id || U.uid(), tipo: 'promocion', productoId: '', productoNombre: descripcion,
      cantidad: descuento, descripcion, descuento,
      alcanceTipo,
      alcanceCategoria: alcanceTipo === 'categoria' ? U.id('promo-alcance-categoria').value : null,
      alcanceGenero: alcanceTipo === 'genero' ? U.id('promo-alcance-genero').value : null,
      alcanceProductoId: alcanceTipo === 'producto' ? U.id('promo-alcance-producto').value : null,
      hasta: hastaVal ? new Date(hastaVal).toISOString() : null,
      fecha: id ? undefined : U.now(), usuarioId: Auth.currentUser.id
    };
    if (id) { const old = await DB.get('movimientos', id); if (old) data.fecha = old.fecha; }
    await DB.put('movimientos', data);
    await Views.Movimientos.syncPromotionPrices();
    App.closeModal();
    Toast.success(`Promoción ${id?'actualizada':'creada'}`);
    await Views.Movimientos.renderTable();
  },

  async eliminarPromocion(id) {
    App.confirm('¿Eliminar esta promoción?', async () => {
      const promo = await DB.get('movimientos', id);
      await DB.delete('movimientos', id);
      await Views.Movimientos.syncPromotionPrices();
      Toast.success('Promoción eliminada');
      await Views.Movimientos.renderTable();
    });
  },

  // Devuelve la promoción activa (más alta, si hay varias) que aplica
  // a un producto dado, o null si no tiene ninguna. Se usa desde el POS
  // para aplicar el descuento automáticamente al agregar al carrito.
  async promocionAplicable(producto, promosActivas = null) {
    const hoy = new Date();
    const promos = promosActivas || (await DB.getAll('movimientos')).filter(m =>
      m.tipo === 'promocion' && (!m.hasta || new Date(m.hasta) >= hoy)
    );
    const aplicables = promos.filter(promo => {
      switch (promo.alcanceTipo) {
        case 'categoria': return producto.categoria === promo.alcanceCategoria;
        case 'genero':    return producto.genero === promo.alcanceGenero;
        case 'producto':  return producto.id === promo.alcanceProductoId;
        case 'todo':
        default:          return true;
      }
    });
    if (!aplicables.length) return null;
    // Si hay varias, se aplica la de mayor descuento (mejor para el cliente).
    return aplicables.reduce((max, p) => (p.descuento > (max?.descuento||0) ? p : max), null);
  },

  async exportCSV() {
    const promos = (await DB.getAll('movimientos')).filter(m => m.tipo === 'promocion').sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    const headers = ['Fecha creación','Descripción','Descuento %','Alcance','Válida hasta'];
    const alcanceLabel = (p) => p.alcanceTipo==='categoria' ? `Categoría: ${p.alcanceCategoria}` : p.alcanceTipo==='genero' ? `Género: ${p.alcanceGenero}` : p.alcanceTipo==='producto' ? 'Perfume específico' : 'Todo el catálogo';
    const rows = promos.map(p=>[p.fecha, p.descripcion||'', p.descuento||0, alcanceLabel(p), p.hasta||'']);
    U.exportExcel('promociones.xlsx', headers, rows);
    Toast.success('Excel exportado');
  }
};

    const ctx = document.getElementById('rep-chart-pay');
    if (ctx) {
      const c = new Chart(ctx, { type: 'bar', data: { labels: ['Efectivo','Transferencia','Crédito'], datasets: [{ data: Object.values(byMethod), backgroundColor: ['rgba(16,185,129,0.7)','rgba(59,130,246,0.7)','rgba(168,85,247,0.7)','rgba(245,158,11,0.7)'], borderRadius: 6 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: U.chartScale({ hideGrid: true }), y: U.chartScale({ money: true }) } } });
      App.charts.push(c);
    }
    const byCat = {};
    productos.forEach(p => { if (p.categoria) { byCat[p.categoria] = (byCat[p.categoria]||0) + (p.stock * (p.precio - p.costo)); } });
    const ctx2 = document.getElementById('rep-chart-margin');
    if (ctx2) {
      const c2 = new Chart(ctx2, { type: 'bar', data: { labels: Object.keys(byCat), datasets: [{ data: Object.values(byCat), backgroundColor: 'rgba(201,168,118,0.6)', borderRadius: 4 }] }, options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: U.chartScale({ money: true }), y: U.chartScale({ hideGrid: true, fontSize: 10 }) } } });
      App.charts.push(c2);
    }
  },

  switchTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#rep-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    const el = document.getElementById(`rep-${id}`);
    if (el) el.classList.add('active');
    btn.classList.add('active');
    // Re-init charts when switching to chart tabs (canvas must be visible first)
    if (id === 'ventas' || id === 'rentabilidad') setTimeout(() => Views.Reportes.initCharts(), 50);

/* ─── CÓDIGOS MAYORISTAS ─── */
Views.CodigosMayoristas = {
  _mounted: false,

  async render() {
    document.getElementById('topbar-title').textContent = 'Códigos Mayoristas';
    const area = document.getElementById('view-area');
    area.innerHTML = `
      <div class="page-header">
        <div>
          <h1>🔑 Códigos Mayoristas</h1>
          <p>Genera y administra accesos temporales de un solo uso para el catálogo mayorista.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="Views.CodigosMayoristas.generar()">＋ Generar código</button>
          <button class="btn btn-secondary" onclick="Views.CodigosMayoristas.render()">↻ Actualizar</button>
        </div>
      </div>

      <div class="stats-grid" style="margin-bottom:18px">
        <div class="stat-card"><div class="stat-icon">🟢</div><div><div class="stat-value" id="mw-disponibles">—</div><div class="stat-label">Disponibles</div></div></div>
        <div class="stat-card"><div class="stat-icon">🔵</div><div><div class="stat-value" id="mw-usados">—</div><div class="stat-label">Usados</div></div></div>
        <div class="stat-card"><div class="stat-icon">🔴</div><div><div class="stat-value" id="mw-vencidos">—</div><div class="stat-label">Vencidos</div></div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h3>Historial de códigos</h3><p class="text-muted">Los códigos se muestran aquí solo para administrar su estado. La clave se entrega en texto plano únicamente al momento de generarla.</p></div>
        </div>
        <div id="mw-table-wrap"><div class="empty-state"><div class="empty-state-icon">⏳</div><h3>Cargando...</h3></div></div>
      </div>`;

    await this.cargar();
  },

  async cargar() {
    try {
      const client = DB.ensureClient();
      const { data, error } = await client
        .from('claves_mayoristas')
        .select('id, clave, descripcion, activa, usada, vence_en, creada_en, usada_en')
        .order('creada_en', { ascending: false });
      if (error) throw error;

      const rows = data || [];
      const now = Date.now();
      const disponibles = rows.filter(r => r.activa && !r.usada && new Date(r.vence_en).getTime() > now).length;
      const usados = rows.filter(r => r.usada).length;
      const vencidos = rows.filter(r => !r.usada && new Date(r.vence_en).getTime() <= now).length;
      const set = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
      set('mw-disponibles', disponibles); set('mw-usados', usados); set('mw-vencidos', vencidos);

      const wrap = document.getElementById('mw-table-wrap');
      if (!rows.length) {
        wrap.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔑</div><h3>No hay códigos todavía</h3><p>Genera el primero con el botón de arriba.</p></div>`;
        return;
      }

      wrap.innerHTML = `<div class="table-wrap"><table class="data-table"><thead><tr>
        <th>Código</th><th>Descripción</th><th>Estado</th><th>Vence</th><th>Creado</th><th>Usado</th>
      </tr></thead><tbody>${rows.map(r => {
        const exp = new Date(r.vence_en).getTime() <= now;
        let estado = 'Disponible', cls = 'badge-green';
        if (r.usada) { estado = 'Usado'; cls = 'badge-blue'; }
        else if (exp || !r.activa) { estado = exp ? 'Vencido' : 'Inactivo'; cls = 'badge-red'; }
        return `<tr>
          <td><strong style="letter-spacing:1px">${U.esc(r.clave || '—')}</strong></td>
          <td><strong>${U.esc(r.descripcion || 'Acceso mayorista')}</strong><div class="text-muted" style="font-size:.72rem">ID: ${U.esc(String(r.id).slice(0,8))}…</div></td>
          <td><span class="badge ${cls}">${estado}</span></td>
          <td>${this.fmtDate(r.vence_en)}</td>
          <td>${this.fmtDate(r.creada_en)}</td>
          <td>${r.usada_en ? this.fmtDate(r.usada_en) : '—'}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
    } catch (e) {
      console.error('[Códigos Mayoristas]', e);
      const wrap = document.getElementById('mw-table-wrap');
      if (wrap) wrap.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>No se pudo cargar</h3><p>${U.esc(e?.message || 'Error desconocido')}</p></div>`;
      Toast.error('No se pudieron cargar los códigos mayoristas');
    }
  },

  async generar() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay open';
    modal.innerHTML = `<div class="modal" style="max-width:520px">
      <div class="modal-header"><h3>🔑 Generar código mayorista</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
      <div class="modal-body">
        <div class="form-group"><label>Descripción</label><input id="mw-desc" class="form-control" placeholder="Ej. Cliente mayorista septiembre"></div>
        <div class="form-group"><label>Duración del acceso</label><select id="mw-hours" class="form-control">
          <option value="1">1 hora</option><option value="6">6 horas</option><option value="12">12 horas</option><option value="24" selected>24 horas</option><option value="72">3 días</option><option value="168">7 días</option><option value="720">30 días</option>
        </select></div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.82rem;color:var(--text2)">
          El código será <strong>de un solo uso</strong>. Al utilizarlo, se consume y se crea una sesión temporal para el catálogo mayorista.
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button><button class="btn btn-primary" id="mw-generate-btn">Generar</button></div>
    </div>`;
    document.body.appendChild(modal);
    const generateBtn = modal.querySelector('#mw-generate-btn');
    const generateStatus = document.createElement('div');
    generateStatus.id = 'mw-generate-status';
    generateStatus.style.cssText = 'margin-top:10px;font-size:.84rem;color:var(--text2);min-height:20px;text-align:center';
    modal.querySelector('.modal-body').appendChild(generateStatus);
    generateBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const btn = generateBtn;
      btn.disabled = true; btn.textContent = 'Generando…';
      generateStatus.textContent = 'Conectando con Supabase…';
      try {
        const client = DB.ensureClient();
        // Asegurar que existe una sesión real de Supabase antes de llamar
        // al RPC administrativo. Esto evita intentar generar el código como anon.
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData?.session?.user) {
          throw new Error('Tu sesión administrativa de Supabase no está activa. Cierra sesión, vuelve a iniciar sesión y prueba nuevamente.');
        }

        const descripcion = document.getElementById('mw-desc').value.trim() || null;
        const horas = Number(document.getElementById('mw-hours').value) || 24;
        generateStatus.textContent = 'Validando permisos y generando código…';
        const { data, error } = await client.rpc('crear_clave_mayorista', {
          p_descripcion: descripcion,
          p_horas: horas
        });
        if (error) {
          generateStatus.textContent = 'Supabase devolvió un error.';
          console.error('[crear_clave_mayorista][Supabase]', {
            code: error.code, message: error.message, details: error.details, hint: error.hint
          });
          let msg = error.message || 'No se pudo generar el código.';
          if (error.code === '42501' || /no autorizado|permission denied|forbidden/i.test(msg)) {
            msg = 'Supabase rechazó la operación administrativa. Verifica que tu usuario autenticado tenga rol "administrador" y que la función crear_clave_mayorista tenga EXECUTE para authenticated.';
          } else if (/function .*crear_clave_mayorista.* does not exist/i.test(msg)) {
            msg = 'La función crear_clave_mayorista no existe en este proyecto de Supabase. Debes crearla antes de generar códigos.';
          }
          throw new Error(msg);
        }

        console.log('[crear_clave_mayorista][OK]', data);
        const result = Array.isArray(data) ? data[0] : data;
        const clave = result?.clave || result?.codigo || result?.clave_mayorista || result?.code || (typeof data === 'string' ? data : null);
        const vence = result?.vence_en || result?.venceEn || result?.expires_at || null;
        if (!clave) throw new Error('Supabase creó el código pero no devolvió la clave en texto plano.');
        modal.querySelector('.modal-body').innerHTML = `<div style="text-align:center;padding:10px 0 4px">
          <div style="font-size:2.4rem">🔑</div><h3>Código generado</h3>
          <p class="text-muted">Entrégalo al cliente mayorista. Esta clave se muestra ahora porque después no podrá recuperarse en texto plano.</p>
          <div style="display:flex;gap:8px;align-items:center;margin:18px 0"><input id="mw-new-code" class="form-control" value="${U.esc(clave)}" readonly style="font-size:1.15rem;font-weight:800;text-align:center;letter-spacing:2px"><button class="btn btn-secondary" id="mw-copy">Copiar</button></div>
          ${vence ? `<div class="text-muted">Vence: <strong>${this.fmtDate(vence)}</strong></div>` : ''}
        </div>`;
        modal.querySelector('.modal-footer').innerHTML = `<button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove(); Views.CodigosMayoristas.render()">Listo</button>`;
        document.getElementById('mw-copy').onclick = async () => { try { await navigator.clipboard.writeText(clave); Toast.success('Código copiado'); } catch { Toast.info('Selecciona y copia el código manualmente'); } };
        Toast.success('Código mayorista generado');
      } catch (e) {
        console.error('[crear_clave_mayorista]', e);
        generateStatus.textContent = e?.message || 'No se pudo generar el código.';
        generateStatus.style.color = 'var(--danger, #ef4444)';
        Toast.error(e?.message || 'No se pudo generar el código');
        btn.disabled = false; btn.textContent = 'Generar';
      }
    });
  },

  fmtDate(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '—';
    return d.toLocaleString('es-DO', { dateStyle: 'short', timeStyle: 'short' });
  }
};

/* ─── SEGURIDAD ─── */
Views.Seguridad = {
  async render() {
    document.getElementById('topbar-title').textContent = 'Seguridad';
